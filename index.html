<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SQUAD MANAGER</title>
<meta name="theme-color" content="#16211B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Squad">
<style>
  :root{
    --bg:#EFF2ED; --card:#fff; --ink:#16211B; --muted:#66736B; --line:#DDE3DC;
    --pitchA:#2E7D4F; --pitchB:#297246; --blue:#1B3C8C;
    --gk:#E8A13A; --df:#1B3C8C; --mf:#2E7D4F; --fw:#C63B3B; --enemy:#3A3F44;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior-y:none;}
  header.top{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:baseline;gap:10px;}
  .brand{font-weight:800;font-size:19px;letter-spacing:.08em;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .brand-sub{font-size:11px;color:rgba(255,255,255,.6);}
  main{padding:14px 12px 96px;max-width:560px;margin:0 auto;}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40;}
  nav.tabs button{flex:1;padding:10px 0 8px;background:none;border:none;border-top:2px solid transparent;color:var(--muted);font-family:inherit;cursor:pointer;}
  nav.tabs button.on{color:var(--blue);border-top-color:var(--blue);}
  nav.tabs .ico{font-size:18px;} nav.tabs .lbl{font-size:10px;font-weight:700;margin-top:2px;}
  .sec-en{font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1.1;text-transform:uppercase;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .sec-ja{font-size:12px;color:var(--muted);margin:2px 0 12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .in{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);outline:none;width:100%;}
  .btn{border-radius:8px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;}
  .btn.pri{background:var(--blue);color:#fff;}
  .btn.grn{background:var(--pitchA);color:#fff;}
  .btn.gho{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.dgr{background:transparent;color:var(--fw);border:1px solid var(--fw);}
  .btn.sm{padding:8px 6px;font-size:12px;}
  .btn:disabled{opacity:.4;}
  .chip{padding:5px 11px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;}
  .lbl-s{font-size:11px;color:var(--muted);}
  .row{display:flex;gap:8px;} .grow{flex:1;}
  .mut{color:var(--muted);}
  .acc-h{width:100%;padding:11px 14px;background:none;border:none;display:flex;align-items:center;cursor:pointer;font-family:inherit;}
  .acc-h .t{font-weight:700;font-size:13px;flex:1;text-align:left;}
  #pitch{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;touch-action:none;
    background:repeating-linear-gradient(0deg,var(--pitchA) 0 12.5%,var(--pitchB) 12.5% 25%);}
  .token{position:absolute;transform:translate(-50%,-50%);touch-action:none;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;-webkit-user-select:none;z-index:1;}
  .token .disc{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .token.guest .disc{border-style:dashed;}
  .token.sel .disc{border:3px solid #FFE24A;}
  .token .nm{margin-top:2px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:4px;padding:1px 5px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #benchbar{position:absolute;left:6px;top:6px;bottom:6px;width:58px;background:rgba(0,0,0,.3);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 0;overflow:auto;z-index:2;}
  .btok{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:0;font-family:inherit;}
  .btok .disc{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:9px;}
  .btok.guest .disc{border-style:dashed;}
  .btok .nm{margin-top:1px;font-size:8px;font-weight:700;color:#fff;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:none;max-height:78vh;overflow:auto;}
  #sheet.show{display:block;}
  table.rot{border-collapse:collapse;width:100%;font-size:12px;}
  table.rot th, table.rot td{padding:6px 5px;text-align:center;}
  table.rot td.nm, table.rot th.nm{text-align:left;padding:6px 10px;position:sticky;left:0;background:#fff;font-weight:700;white-space:nowrap;font-size:11px;}
  table.rot thead tr{background:var(--bg);} table.rot thead th.nm{background:var(--bg);}
  table.rot tbody tr{border-top:1px solid var(--line);}
  table.rot td.cell{cursor:pointer;}
  .memrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);background:#fff;}
  .memrow:first-child{border-top:none;}
  .memrow.dragging{opacity:.45;}
  .dragh{touch-action:none;cursor:grab;color:var(--muted);font-size:18px;padding:8px 6px;user-select:none;-webkit-user-select:none;}
  .avatar{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .badge{color:#fff;border-radius:4px;font-size:10px;font-weight:800;padding:1px 5px;letter-spacing:.05em;}
  .subbadge{font-size:10px;border-radius:4px;padding:0 5px;font-weight:800;border:1px dashed;}
  .xbtn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px;}
  .mlist button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:#fff;border:none;border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit;text-align:left;font-size:14px;}
  .optrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap;}
  .optrow select,.optrow input{border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px;font-family:inherit;background:#fff;}
  .pchip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;margin:2px;}
</style>
</head>
<body>
<header class="top">
  <div class="brand">SQUAD MANAGER</div>
  <div class="brand-sub">チーム運営ノート</div>
</header>
<main id="app"></main>
<div id="sheet"></div>
<nav class="tabs">
  <button id="tb-members" onclick="act.tab('members')"><div class="ico">👥</div><div class="lbl">メンバー</div></button>
  <button id="tb-board" onclick="act.tab('board')"><div class="ico">📋</div><div class="lbl">ボード</div></button>
  <button id="tb-rotation" onclick="act.tab('rotation')"><div class="ico">⏱</div><div class="lbl">出場時間</div></button>
</nav>

<script>
"use strict";
/* ================= constants ================= */
var KEY = "soccer-squad-v2";
var POS_GROUPS = { GK:["GK"], DF:["CB","RB","LB","RWB","LWB"], MF:["CDM","CM","CAM","RM","LM"], FW:["ST","CF","RW","LW"] };
var ALL_POS = [].concat(POS_GROUPS.GK, POS_GROUPS.DF, POS_GROUPS.MF, POS_GROUPS.FW);
function groupOf(p){ for (var g in POS_GROUPS){ if (POS_GROUPS[g].indexOf(p) >= 0) return g; } return "MF"; }
var GC = { GK:"#E8A13A", DF:"#1B3C8C", MF:"#2E7D4F", FW:"#C63B3B" };
function pc(p){ if (p === "LWB" || p === "RWB") return GC.MF; return GC[groupOf(p)]; }

var FORMATIONS = {
  "4-4-2": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["RM",85,50],["CM",62,53],["CM",38,53],["LM",15,50],["ST",38,28],["ST",62,28]],
  "4-3-3": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["CM",30,52],["CDM",50,58],["CM",70,52],["RW",80,28],["ST",50,23],["LW",20,28]],
  "3-5-2": [["GK",50,91],["CB",28,74],["CB",50,77],["CB",72,74],["RWB",90,48],["CM",68,53],["CDM",50,58],["CM",32,53],["LWB",10,48],["ST",38,26],["ST",62,26]],
  "4-2-3-1": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["CDM",38,58],["CDM",62,58],["RM",80,40],["CAM",50,43],["LM",20,40],["ST",50,24]]
};
var TIME_PRESETS = [["20分×2本",40,2],["25分×2本",50,2],["30分×2本",60,2],["30分×3本",90,3],["40分×2本",80,2],["45分×2本",90,2]];

function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function memLabel(m){ return (m.num ? "#" + m.num + " " : "") + m.name; }
function memById(id){
  for (var i = 0; i < S.members.length; i++){ if (S.members[i].id === id) return S.members[i]; }
  var g = ui.rot.guests || [];
  for (var j = 0; j < g.length; j++){ if (g[j].id === id) return g[j]; }
  return null;
}
function roster(){ return S.members.concat(ui.rot.guests || []); }
function evLabel(ev){
  var d = ev.date ? ev.date.replace(/^\d{4}-/, "").replace("-", "/") : "日付未設定";
  return d + " vs " + (ev.opponent || "未定");
}

/* ================= state ================= */
var S = { members: [], board: null, custom: {}, timePresets: [], events: [] };
try { var raw = localStorage.getItem(KEY); if (raw){ var d = JSON.parse(raw); for (var k in d) S[k] = d[k]; } } catch(e){}
if (!S.members) S.members = [];
if (!S.custom) S.custom = {};
if (!S.timePresets) S.timePresets = [];
if (!S.events) S.events = [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

var ui = {
  tab: "members",
  mName: "", mNum: "", mPos: "CM", mSub: [],
  fname: (S.board && S.board.fname) || "4-4-2",
  sheet: null,
  rot: { attend: [], field: 11, total: 60, seg: 4, gk: "", opts: {}, guests: [] },
  eventId: null, evForm: null, showEvents: false,
  rotResult: null,
  showOpts: false, showAttend: true, rotView: "table",
  em: null
};

function getSlots(name){ return FORMATIONS[name] || S.custom[name] || FORMATIONS["4-4-2"]; }
function allFormationNames(){ return Object.keys(FORMATIONS).concat(Object.keys(S.custom)); }
function compress(y){ return 52 + y * 0.46; }
function expand(y){ return Math.max(2, Math.min(98, (y - 52) / 0.46)); }
function board(){ if (!S.board) S.board = { fname: ui.fname, tokens: [], bench: [], showEnemy: false, showBench: false }; if (!S.board.bench) S.board.bench = []; return S.board; }
function clampTokenY(t, y){
  if (board().showEnemy){
    if (t.side === "ally") return Math.max(52, Math.min(98, y));
    if (t.side === "enemy") return Math.max(2, Math.min(48, y));
  }
  return Math.max(2, Math.min(98, y));
}

/* ================= render ================= */
function render(){
  var el = document.getElementById("app");
  if (ui.tab === "members") el.innerHTML = rMembers();
  else if (ui.tab === "board") el.innerHTML = rBoard();
  else el.innerHTML = rRotation();
  ["members","board","rotation"].forEach(function(t){
    document.getElementById("tb-" + t).className = (ui.tab === t) ? "on" : "";
  });
  if (ui.tab === "board") bindPitch();
  if (ui.tab === "members") bindMemberDrag();
  renderSheet();
}

/* ---------- members ---------- */
function posChips(cur, handler){
  var h = "";
  for (var g in POS_GROUPS){
    h += '<div style="display:flex;gap:5px;align-items:center;margin-bottom:6px;flex-wrap:wrap">';
    h += '<span style="font-size:10px;font-weight:800;width:26px;color:' + GC[g] + '">' + g + '</span>';
    POS_GROUPS[g].forEach(function(p){
      var on = cur === p;
      h += '<button class="chip" style="' + (on ? "border-color:" + pc(p) + ";background:" + pc(p) + ";color:#fff" : "") + '" onclick="' + handler + '(\'' + p + '\')">' + p + '</button>';
    });
    h += '</div>';
  }
  return h;
}
function subChips(mainPos, subs, handler){
  var h = '<div style="display:flex;gap:5px;flex-wrap:wrap">';
  ALL_POS.forEach(function(p){
    if (p === mainPos) return;
    var on = subs.indexOf(p) >= 0;
    h += '<button class="chip" style="padding:4px 10px;font-size:11px;border-width:1px;border-style:dashed;' + (on ? "border-color:" + pc(p) + ";background:" + pc(p) + "18;color:" + pc(p) : "") + '" onclick="' + handler + '(\'' + p + '\')">' + p + '</button>';
  });
  return h + '</div>';
}
function rMembers(){
  var h = '<div class="sec-en">Squad List</div><div class="sec-ja">メンバー登録・編集・並べ替え</div>';
  h += '<div class="card" style="margin-bottom:14px">';
  h += '<div class="row"><input class="in grow" id="mname" placeholder="名前を入力" value="' + esc(ui.mName) + '" oninput="ui.mName=this.value">';
  h += '<input class="in" id="mnum" type="number" placeholder="背番号" style="width:88px" value="' + esc(ui.mNum) + '" oninput="ui.mNum=this.value"></div>';
  h += '<div class="lbl-s" style="margin:12px 0 4px">メインポジション</div>' + posChips(ui.mPos, "act.mPos");
  h += '<div class="lbl-s" style="margin:10px 0 4px">サブポジション（複数可）</div>' + subChips(ui.mPos, ui.mSub, "act.mSub");
  h += '<button class="btn pri" style="width:100%;margin-top:12px" onclick="act.addMember()">メンバーを追加</button></div>';

  if (S.members.length === 0){
    h += '<div style="text-align:center;color:var(--muted);font-size:13px;padding:30px">まだメンバーがいません。上から追加してください。</div>';
  } else {
    h += '<div class="lbl-s" style="margin:0 0 6px 2px">タップで編集 ／ 右端の ≡ を押したままドラッグで並べ替え</div>';
    h += '<div class="card" style="padding:0;overflow:hidden"><div id="memlist">';
    S.members.forEach(function(m){
      h += '<div class="memrow" data-id="' + m.id + '">';
      h += '<div class="grow" style="display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer" onclick="act.editMember(\'' + m.id + '\')">';
      h += '<div class="avatar" style="background:' + pc(m.pos) + '">' + (m.num ? esc(m.num) : esc(m.name.slice(0,1))) + '</div>';
      h += '<div class="grow" style="min-width:0"><div style="font-weight:700;font-size:14px">' + esc(m.name) + '</div>';
      h += '<div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap"><span class="badge" style="background:' + pc(m.pos) + '">' + m.pos + '</span>';
      (m.sub || []).forEach(function(s){
        h += '<span class="subbadge" style="color:' + pc(s) + ';border-color:' + pc(s) + '">' + s + '</span>';
      });
      h += '</div></div></div>';
      h += '<span class="dragh" data-id="' + m.id + '">≡</span></div>';
    });
    h += '</div></div>';
  }
  return h;
}

/* ---------- board ---------- */
function rBoard(){
  var b = board();
  var h = '<div class="sec-en">Tactics Board</div><div class="sec-ja">フォーメーション作成・戦術ボード（11人制）</div>';
  h += '<div class="row" style="margin-bottom:6px"><select class="in grow" style="padding:8px 10px" onchange="ui.fname=this.value;render()">';
  allFormationNames().forEach(function(k){
    var label = FORMATIONS[k] ? k : k + "（自作）";
    h += '<option value="' + esc(k) + '"' + (ui.fname === k ? " selected" : "") + '>' + esc(label) + '</option>';
  });
  h += '</select>';
  if (S.custom[ui.fname]) h += '<button class="btn dgr sm" onclick="act.delFormation()">削除</button>';
  h += '<button class="btn grn sm" onclick="act.applyFormation()">自動配置</button></div>';
  h += '<div class="row" style="margin-bottom:8px">';
  h += '<button class="btn sm ' + (b.showBench ? "pri" : "gho") + ' grow" onclick="act.toggleBench()">ベンチ</button>';
  h += '<button class="btn sm gho grow" onclick="act.addGuest()">＋助っ人</button>';
  h += '<button class="btn sm ' + (b.showEnemy ? "pri" : "gho") + ' grow" onclick="act.toggleEnemy()">相手を表示</button>';
  h += '<button class="btn sm gho grow" onclick="act.saveFormation()">配置を保存</button></div>';
  h += '<div class="row" style="margin-bottom:8px"><button class="btn sm pri grow" onclick="act.openEventForm()">📅 この編成を試合として保存</button>';
  if (S.events.length) h += '<button class="btn sm gho" onclick="ui.showEvents=!ui.showEvents;render()">保存済み ' + S.events.length + '件 ' + (ui.showEvents ? "▲" : "▼") + '</button>';
  h += '</div>';
  if (ui.showEvents && S.events.length){
    h += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:8px">';
    S.events.forEach(function(ev){
      h += '<div class="memrow"><div class="grow" style="min-width:0"><div style="font-weight:700;font-size:13px">' + esc(evLabel(ev)) + '</div>';
      h += '<div class="lbl-s">' + esc(ev.fname || "") + (ev.note ? " ・ " + esc(ev.note) : "") + '</div></div>';
      h += '<button class="btn sm gho" onclick="act.loadEvent(\'' + ev.id + '\')">読込</button>';
      h += '<button class="xbtn" onclick="act.delEvent(\'' + ev.id + '\')">×</button></div>';
    });
    h += '</div>';
  }
  h += '<div id="pitch">';
  h += '<svg viewBox="0 0 300 400" style="position:absolute;inset:0;width:100%;height:100%"><g stroke="rgba(255,255,255,.85)" stroke-width="2" fill="none"><rect x="8" y="8" width="284" height="384"/><line x1="8" y1="200" x2="292" y2="200"/><circle cx="150" cy="200" r="34"/><rect x="75" y="8" width="150" height="56"/><rect x="75" y="336" width="150" height="56"/><rect x="112" y="8" width="76" height="22"/><rect x="112" y="370" width="76" height="22"/></g></svg>';
  var allyCount = 0;
  (b.tokens || []).forEach(function(t){
    if (t.side === "ally") allyCount++;
    if (t.side === "enemy" && !b.showEnemy) return;
    var cls = "token" + (t.guest ? " guest" : "") + (ui.sheet && ui.sheet.id === t.id ? " sel" : "");
    var bg = t.side === "enemy" ? "var(--enemy)" : pc(t.pos);
    h += '<div class="' + cls + '" data-id="' + t.id + '" style="left:' + t.x + '%;top:' + t.y + '%">';
    h += '<div class="disc" style="background:' + bg + '">' + (t.side === "enemy" ? "敵" : t.pos) + '</div>';
    h += '<div class="nm">' + (t.guest ? "⚡" : "") + esc(t.name) + '</div></div>';
  });
  if (allyCount === 0){
    h += '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-size:13px">フォーメーションを選んで「自動配置」</div>';
  }
  if (b.showBench){
    h += '<div id="benchbar"><div style="color:#fff;font-size:9px;font-weight:800;letter-spacing:.1em">BENCH</div>';
    (b.bench || []).forEach(function(t){
      var m = t.memberId ? memById(t.memberId) : null;
      var bg = m ? pc(m.pos) : (t.guest ? "var(--pitchA)" : "#6B7480");
      h += '<button class="btok' + (t.guest ? " guest" : "") + '" onclick="act.openToken(\'' + t.id + '\')">';
      h += '<div class="disc" style="background:' + bg + '">' + (m && m.num ? esc(m.num) : (t.guest ? "⚡" : "")) + '</div>';
      h += '<div class="nm">' + esc(t.name) + '</div></button>';
    });
    h += '<button class="btok" onclick="act.addBench()"><div class="disc" style="background:rgba(255,255,255,.25);font-size:14px">＋</div></button>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

/* ---------- rotation ---------- */
function estMinutes(){
  /* 個別設定を加味した目安 */
  var N = ui.rot.attend.length;
  if (!N) return {};
  var base = ui.rot.field * ui.rot.total;
  var sumW = 0;
  ui.rot.attend.forEach(function(id){
    var o = ui.rot.opts[id] || {};
    sumW += o.w === "hi" ? 1.4 : o.w === "lo" ? 0.6 : 1;
  });
  var out = {};
  ui.rot.attend.forEach(function(id){
    var o = ui.rot.opts[id] || {};
    var w = o.w === "hi" ? 1.4 : o.w === "lo" ? 0.6 : 1;
    var e = base * w / sumW;

    if (o.max) e = Math.min(e, o.max);
    out[id] = Math.round(e / 15) * 15; /* 15分刻みに丸め */
  });
  return out;
}

/* ================= rotation algorithm ================= */
function buildRotation(players, fieldCount, totalMin, segments, gkId){
  var segMin = totalMin / segments;
  var time = {}, lastOn = {}, P = {};
  players.forEach(function(p){ time[p.id] = 0; lastOn[p.id] = -99; P[p.id] = p; });
  var grid = [];
  var gk = gkId && P[gkId] ? P[gkId] : null;
  for (var s = 0; s < segments; s++){
    var gkOn = gk && (gk.from - 1 <= s);
    var pool = players.filter(function(p){
      if (gk && p.id === gk.id) return false;
      if (p.from - 1 > s) return false;
      if (p.max && time[p.id] + segMin > p.max + 0.01) return false;
      return true;
    });
    var need = Math.min(pool.length, fieldCount - (gkOn ? 1 : 0));
    pool.sort(function(a, b){
      return (time[a.id] / a.w - time[b.id] / b.w) || (lastOn[a.id] - lastOn[b.id]) || (a._r - b._r);
    });
    var on = pool.slice(0, need).map(function(p){ return p.id; });
    if (gkOn) on.unshift(gk.id);
    on.forEach(function(id){ time[id] += segMin; lastOn[id] = s; });
    grid.push(on);
  }
  return { grid: grid, segMin: segMin };
}

/* ================= actions ================= */
var act = {
  tab: function(t){ ui.tab = t; ui.sheet = null; render(); },
  closeSheet: function(){ ui.sheet = null; render(); },

  /* members */
  mPos: function(p){ ui.mPos = p; ui.mSub = ui.mSub.filter(function(x){ return x !== p; }); render(); },
  mSub: function(p){ var i = ui.mSub.indexOf(p); if (i >= 0) ui.mSub.splice(i, 1); else ui.mSub.push(p); render(); },
  addMember: function(){
    var n = (document.getElementById("mname").value || "").trim();
    if (!n) return;
    var num = (document.getElementById("mnum").value || "").trim();
    S.members.push({ id: uid(), name: n, num: num, pos: ui.mPos, sub: ui.mSub.slice() });
    ui.mName = ""; ui.mNum = ""; ui.mSub = [];
    save(); render();
  },
  editMember: function(id){
    var m = memById(id);
    if (!m) return;
    ui.em = { id: m.id, name: m.name, num: m.num || "", pos: m.pos, sub: (m.sub || []).slice() };
    ui.sheet = { type: "member", id: id };
    renderSheet();
  },
  emPos: function(p){ ui.em.pos = p; ui.em.sub = ui.em.sub.filter(function(x){ return x !== p; }); renderSheet(); },
  emSub: function(p){ var i = ui.em.sub.indexOf(p); if (i >= 0) ui.em.sub.splice(i, 1); else ui.em.sub.push(p); renderSheet(); },
  saveMember: function(){
    var m = memById(ui.em.id);
    if (!m) return;
    var n = (ui.em.name || "").trim();
    if (!n) return;
    m.name = n; m.num = String(ui.em.num || "").trim(); m.pos = ui.em.pos; m.sub = ui.em.sub.slice();
    var b = board();
    b.tokens.concat(b.bench).forEach(function(t){ if (t.memberId === m.id) t.name = m.name; });
    ui.sheet = null;
    save(); render();
  },
  delMember: function(id){
    if (!confirm("このメンバーを削除しますか？")) return;
    S.members = S.members.filter(function(m){ return m.id !== id; });
    ui.rot.attend = ui.rot.attend.filter(function(x){ return x !== id; });
    delete ui.rot.opts[id];
    var b = board();
    b.tokens.forEach(function(t){ if (t.memberId === id){ t.memberId = null; t.name = "未定"; } });
    b.bench = b.bench.filter(function(t){ return t.memberId !== id; });
    ui.sheet = null;
    save(); render();
  },
  reorderMembers: function(ids){
    var map = {};
    S.members.forEach(function(m){ map[m.id] = m; });
    var next = [];
    ids.forEach(function(id){ if (map[id]){ next.push(map[id]); delete map[id]; } });
    for (var k in map) next.push(map[k]);
    S.members = next;
    save(); render();
  },

  /* board */
  applyFormation: function(){
    var b = board();
    var slots = getSlots(ui.fname);
    var used = {};
    function pick(p){
      var g = groupOf(p);
      var tests = [
        function(m){ return m.pos === p; },
        function(m){ return (m.sub || []).indexOf(p) >= 0; },
        function(m){ return groupOf(m.pos) === g; },
        function(m){ return (m.sub || []).some(function(s){ return groupOf(s) === g; }); },
        function(){ return true; }
      ];
      for (var i = 0; i < tests.length; i++){
        for (var j = 0; j < S.members.length; j++){
          var m = S.members[j];
          if (!used[m.id] && tests[i](m)){ used[m.id] = true; return m; }
        }
      }
      return null;
    }
    var ally = slots.map(function(sl){
      var m = pick(sl[0]);
      var y = b.showEnemy ? compress(sl[2]) : sl[2];
      return { id: uid(), side: "ally", pos: sl[0], x: sl[1], y: y, memberId: m ? m.id : null, name: m ? m.name : "未定", guest: false };
    });
    var enemies = b.tokens.filter(function(t){ return t.side === "enemy"; });
    var guestBench = b.bench.filter(function(t){ return t.guest; });
    var rest = S.members.filter(function(m){ return !used[m.id]; }).map(function(m){
      return { id: uid(), memberId: m.id, name: m.name, guest: false };
    });
    b.fname = ui.fname;
    b.tokens = ally.concat(enemies);
    b.bench = rest.concat(guestBench);
    ui.sheet = null;
    save(); render();
  },
  saveFormation: function(){
    var b = board();
    var ally = b.tokens.filter(function(t){ return t.side === "ally" && !t.guest; });
    if (ally.length === 0){ alert("保存する配置がありません。先に駒を配置してください。"); return; }
    var name = prompt("フォーメーション名を入力（例: 4-1-4-1）");
    if (!name) return;
    name = name.trim();
    if (!name) return;
    if (FORMATIONS[name]){ alert("その名前は標準フォーメーションで使われています。別名にしてください。"); return; }
    S.custom[name] = ally.map(function(t){
      return [t.pos, Math.round(t.x * 10) / 10, Math.round((b.showEnemy ? expand(t.y) : t.y) * 10) / 10];
    });
    ui.fname = name;
    save(); render();
    alert("フォーメーション「" + name + "」を保存しました");
  },
  delFormation: function(){
    if (!S.custom[ui.fname]) return;
    if (!confirm("フォーメーション「" + ui.fname + "」を削除しますか？")) return;
    delete S.custom[ui.fname];
    ui.fname = "4-4-2";
    save(); render();
  },
  toggleEnemy: function(){
    var b = board();
    if (!b.showEnemy){
      b.showEnemy = true;
      b.tokens.forEach(function(t){
        if (t.side === "ally") t.y = clampTokenY(t, compress(t.y));
        if (t.side === "enemy") t.y = clampTokenY(t, t.y);
      });
      if (!b.tokens.some(function(t){ return t.side === "enemy"; })){
        FORMATIONS["4-4-2"].forEach(function(sl, i){
          b.tokens.push({ id: uid(), side: "enemy", pos: sl[0], x: 100 - sl[1], y: Math.max(2, Math.min(48, (100 - sl[2]) * 0.46)), name: "相手" + (i + 1), memberId: null, guest: false });
        });
      }
      b.showEnemy = true;
    } else {
      b.showEnemy = false;
      b.tokens.forEach(function(t){ if (t.side === "ally") t.y = expand(t.y); });
    }
    save(); render();
  },
  toggleBench: function(){
    var b = board();
    b.showBench = !b.showBench;
    save(); render();
  },
  addBench: function(){
    board().bench.push({ id: uid(), memberId: null, name: "控え", guest: false });
    save(); render();
  },
  addGuest: function(){
    var b = board();
    b.tokens.push({ id: uid(), side: "ally", pos: "CM", x: 50, y: b.showEnemy ? 75 : 50, memberId: null, name: "助っ人", guest: true });
    save(); render();
  },
  openToken: function(id){ ui.sheet = { type: "token", id: id }; render(); },
  tokenPos: function(p){
    var f = findToken(ui.sheet.id);
    if (f){ f.t.pos = p; save(); render(); }
  },
  assignMember: function(mid){
    var m = memById(mid);
    var f = findToken(ui.sheet.id);
    if (!m || !f) return;
    var b = board();
    b.tokens.forEach(function(t){ if (t.memberId === m.id && t.id !== f.t.id){ t.memberId = null; t.name = "未定"; } });
    b.bench = b.bench.filter(function(t){ return !(t.memberId === m.id && t.id !== f.t.id); });
    f.t.memberId = m.id; f.t.name = m.name; f.t.guest = false;
    ui.sheet = null;
    save(); render();
  },
  setGuest: function(){
    var n = (document.getElementById("guestname").value || "").trim();
    if (!n) return;
    var f = findToken(ui.sheet.id);
    if (!f) return;
    f.t.memberId = null; f.t.name = n; f.t.guest = true;
    ui.sheet = null;
    save(); render();
  },
  renameEnemy: function(){
    var n = (document.getElementById("guestname").value || "").trim();
    if (!n) return;
    var f = findToken(ui.sheet.id);
    if (f){ f.t.name = n; }
    ui.sheet = null;
    save(); render();
  },
  clearToken: function(){
    var f = findToken(ui.sheet.id);
    if (f){ f.t.memberId = null; f.t.name = f.bench ? "控え" : "未定"; f.t.guest = false; }
    ui.sheet = null;
    save(); render();
  },
  deleteToken: function(){
    var b = board();
    b.tokens = b.tokens.filter(function(t){ return t.id !== ui.sheet.id; });
    b.bench = b.bench.filter(function(t){ return t.id !== ui.sheet.id; });
    ui.sheet = null;
    save(); render();
  },

  /* events */
  openEventForm: function(){
    var b = board();
    if (!b.tokens.some(function(t){ return t.side === "ally"; })){
      alert("先にボードで選手を配置してください。");
      return;
    }
    var today = new Date();
    var d = today.getFullYear() + "-" + ("0" + (today.getMonth() + 1)).slice(-2) + "-" + ("0" + today.getDate()).slice(-2);
    ui.evForm = { id: null, date: d, opponent: "", note: "" };
    ui.sheet = { type: "event" };
    renderSheet();
  },
  saveEvent: function(){
    var ef = ui.evForm, b = board();
    var ev = {
      id: ef.id || uid(),
      date: ef.date, opponent: (ef.opponent || "").trim(), note: (ef.note || "").trim(),
      fname: b.fname,
      tokens: JSON.parse(JSON.stringify(b.tokens)),
      bench: JSON.parse(JSON.stringify(b.bench)),
      showEnemy: b.showEnemy, showBench: b.showBench,
      rot: null
    };
    if (ef.id){
      S.events = S.events.map(function(x){ return x.id === ef.id ? ev : x; });
    } else {
      S.events.unshift(ev);
    }
    ui.sheet = null; ui.showEvents = true;
    save(); render();
    alert("「" + evLabel(ev) + "」を保存しました");
  },
  loadEvent: function(id){
    var ev = null;
    S.events.forEach(function(x){ if (x.id === id) ev = x; });
    if (!ev) return;
    if (!confirm("「" + evLabel(ev) + "」の編成をボードに読み込みます。現在の配置は上書きされます。")) return;
    S.board = {
      fname: ev.fname, tokens: JSON.parse(JSON.stringify(ev.tokens)),
      bench: JSON.parse(JSON.stringify(ev.bench)),
      showEnemy: ev.showEnemy, showBench: ev.showBench
    };
    ui.fname = ev.fname;
    ui.sheet = null;
    save(); render();
  },
  delEvent: function(id){
    var ev = null;
    S.events.forEach(function(x){ if (x.id === id) ev = x; });
    if (!ev) return;
    if (!confirm("「" + evLabel(ev) + "」を削除しますか？")) return;
    S.events = S.events.filter(function(x){ return x.id !== id; });
    if (ui.eventId === id){ ui.eventId = null; ui.rot.guests = []; }
    save(); render();
  },
  pickEvent: function(id){
    if (!id){
      ui.eventId = null; ui.rot.guests = []; ui.rot.attend = []; ui.rotResult = null;
      render(); return;
    }
    var ev = null;
    S.events.forEach(function(x){ if (x.id === id) ev = x; });
    if (!ev) return;
    ui.eventId = id;
    /* 参加者 = スタメン + ベンチ（助っ人含む） */
    var attend = [], guests = [];
    var all = (ev.tokens || []).filter(function(t){ return t.side === "ally"; }).concat(ev.bench || []);
    all.forEach(function(t){
      if (t.memberId && memById(t.memberId)){
        if (attend.indexOf(t.memberId) < 0) attend.push(t.memberId);
      } else if (t.guest && t.name){
        var gid = "g_" + ev.id + "_" + t.id;
        guests.push({ id: gid, name: t.name, guest: true, pos: t.pos || "CM", sub: [] });
        attend.push(gid);
      }
    });
    ui.rot.guests = guests;
    ui.rot.attend = attend;
    if (ev.rot){
      ui.rot.field = ev.rot.field; ui.rot.total = ev.rot.total; ui.rot.seg = ev.rot.seg;
      ui.rot.gk = ev.rot.gk || ""; ui.rot.opts = JSON.parse(JSON.stringify(ev.rot.opts || {}));
      if (ev.rot.attend && ev.rot.attend.length) ui.rot.attend = ev.rot.attend.slice();
      ui.rotResult = ev.rot.result ? JSON.parse(JSON.stringify(ev.rot.result)) : null;
    } else {
      ui.rot.opts = {}; ui.rot.gk = ""; ui.rotResult = null;
      var onField = (ev.tokens || []).filter(function(t){ return t.side === "ally"; }).length;
      if (onField) ui.rot.field = onField;
    }
    ui.showAttend = false;
    render();
  },
  saveRotToEvent: function(){
    if (!ui.eventId) return;
    S.events.forEach(function(ev){
      if (ev.id !== ui.eventId) return;
      ev.rot = {
        field: ui.rot.field, total: ui.rot.total, seg: ui.rot.seg, gk: ui.rot.gk,
        attend: ui.rot.attend.slice(),
        opts: JSON.parse(JSON.stringify(ui.rot.opts)),
        guests: JSON.parse(JSON.stringify(ui.rot.guests || [])),
        result: ui.rotResult ? JSON.parse(JSON.stringify(ui.rotResult)) : null
      };
    });
    save();
    alert("出場時間の設定を試合に保存しました");
  },

  /* rotation */
  rotToggle: function(id){
    var i = ui.rot.attend.indexOf(id);
    if (i >= 0){
      ui.rot.attend.splice(i, 1);
      if (ui.rot.gk === id) ui.rot.gk = "";
    } else ui.rot.attend.push(id);
    render();
  },
  optW: function(id, v){ (ui.rot.opts[id] = ui.rot.opts[id] || {}).w = v; render(); },
  optFrom: function(id, v){ (ui.rot.opts[id] = ui.rot.opts[id] || {}).from = +v; render(); },
  optMax: function(id, v){ (ui.rot.opts[id] = ui.rot.opts[id] || {}).max = v === "" ? "" : +v; },
  preset: function(v){
    if (v === "") return;
    var all = TIME_PRESETS.concat(S.timePresets);
    var p = all[+v];
    if (!p) return;
    ui.rot.total = p[1];
    ui.rot.seg = (p[1] % 15 === 0) ? p[1] / 15 : p[2]; /* 15分刻み優先 */
    render();
  },
  seg15: function(){
    if (ui.rot.total % 15 !== 0) return;
    ui.rot.seg = ui.rot.total / 15;
    render();
  },
  addPreset: function(){
    var v = prompt("追加する試合時間を入力\n例: 35×2（35分を2本） / 35x2 / 70（合計分のみ）");
    if (!v) return;
    v = v.trim();
    var m = v.match(/^(\d+)\s*[×xX*]\s*(\d+)$/);
    if (m){
      var a = +m[1], bnum = +m[2];
      S.timePresets.push([a + "分×" + bnum + "本", a * bnum, bnum]);
    } else if (/^\d+$/.test(v)){
      S.timePresets.push([v + "分(合計)", +v, ui.rot.seg]);
    } else {
      alert("形式が読み取れませんでした。「35×2」または「70」のように入力してください。");
      return;
    }
    save(); render();
  },
  runRot: function(){
    var players = roster().filter(function(m){ return ui.rot.attend.indexOf(m.id) >= 0; })
      .map(function(m){
        var o = ui.rot.opts[m.id] || {};
        return {
          id: m.id, _r: Math.random(),
          w: o.w === "hi" ? 1.4 : o.w === "lo" ? 0.6 : 1,
          from: o.from || 1,
          max: o.max || 0
        };
      });
    if (!players.length) return;
    var r = buildRotation(players, ui.rot.field, ui.rot.total, ui.rot.seg, ui.rot.gk || null);
    r.ids = players.map(function(p){ return p.id; });
    r.gk = ui.rot.gk || null;
    r.sub = [];
    for (var i = 0; i < r.grid.length; i++) r.sub.push(true);
    ui.rotResult = r;
    ui.rotView = "table";
    render();
  },
  cell: function(pid, col){
    var r = ui.rotResult;
    if (!r) return;
    /* 連結ブロックの範囲を求める */
    var s = col; while (s > 0 && !r.sub[s]) s--;
    var e = col; while (e + 1 < r.grid.length && !r.sub[e + 1]) e++;
    var newState = r.grid[col].indexOf(pid) < 0;
    for (var c = s; c <= e; c++){
      var idx = r.grid[c].indexOf(pid);
      if (newState && idx < 0) r.grid[c].push(pid);
      if (!newState && idx >= 0) r.grid[c].splice(idx, 1);
    }
    render();
  },
  subToggle: function(i){
    var r = ui.rotResult;
    if (!r) return;
    r.sub[i] = !r.sub[i];
    if (!r.sub[i]){
      /* まとめる: ブロック先頭の並びをコピー */
      var s = i; while (s > 0 && !r.sub[s]) s--;
      var e = i; while (e + 1 < r.grid.length && !r.sub[e + 1]) e++;
      for (var c = s; c <= e; c++) r.grid[c] = r.grid[s].slice();
    }
    render();
  }
};

function tok(id){
  var f = findToken(id);
  return f ? f.t : {};
}

/* ================= pitch drag & tap ================= */
function bindPitch(){
  var pitch = document.getElementById("pitch");
  if (!pitch) return;
  var drag = null;
  pitch.addEventListener("pointerdown", function(e){
    var el = e.target.closest(".token");
    if (!el) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    drag = { id: el.getAttribute("data-id"), el: el, sx: e.clientX, sy: e.clientY, moved: false };
  });
  pitch.addEventListener("pointermove", function(e){
    if (!drag) return;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6) drag.moved = true;
    if (!drag.moved) return;
    var r = pitch.getBoundingClientRect();
    var t = tok(drag.id);
    var x = Math.max(2, Math.min(98, (e.clientX - r.left) / r.width * 100));
    var y = clampTokenY(t, (e.clientY - r.top) / r.height * 100);
    drag.el.style.left = x + "%";
    drag.el.style.top = y + "%";
    t.x = x; t.y = y;
  });
  function up(){
    if (!drag) return;
    if (drag.moved){ save(); }
    else { ui.sheet = { type: "token", id: drag.id }; renderSheet(); rerenderSel(); }
    drag = null;
  }
  pitch.addEventListener("pointerup", up);
  pitch.addEventListener("pointercancel", up);
}
function rerenderSel(){
  document.querySelectorAll(".token").forEach(function(el){
    if (ui.sheet && el.getAttribute("data-id") === ui.sheet.id) el.classList.add("sel");
    else el.classList.remove("sel");
  });
}

/* ================= member list drag reorder ================= */
function bindMemberDrag(){
  var list = document.getElementById("memlist");
  if (!list) return;
  var drag = null;
  list.addEventListener("pointerdown", function(e){
    var handle = e.target.closest(".dragh");
    if (!handle) return;
    e.preventDefault();
    var row = handle.closest(".memrow");
    try { handle.setPointerCapture(e.pointerId); } catch(err){}
    drag = { row: row };
    row.classList.add("dragging");
  });
  list.addEventListener("pointermove", function(e){
    if (!drag) return;
    e.preventDefault();
    var rows = Array.prototype.slice.call(list.children);
    for (var i = 0; i < rows.length; i++){
      var sib = rows[i];
      if (sib === drag.row) continue;
      var r = sib.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2){
        if (sib.previousSibling !== drag.row) list.insertBefore(drag.row, sib);
        return;
      }
    }
    if (list.lastElementChild !== drag.row) list.appendChild(drag.row);
  });
  function up(){
    if (!drag) return;
    drag.row.classList.remove("dragging");
    var ids = Array.prototype.map.call(list.children, function(el){ return el.getAttribute("data-id"); });
    drag = null;
    act.reorderMembers(ids);
  }
  list.addEventListener("pointerup", up);
  list.addEventListener("pointercancel", up);
}

/* ================= boot ================= */
render();
if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
