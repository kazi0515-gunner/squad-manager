<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SQUAD MANAGER</title>
<meta name="theme-color" content="#16211B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Squad">
<style>
  :root{
    --bg:#EFF2ED; --card:#fff; --ink:#16211B; --muted:#66736B; --line:#DDE3DC;
    --pitchA:#2E7D4F; --pitchB:#297246; --blue:#1B3C8C;
    --gk:#E8A13A; --df:#1B3C8C; --mf:#2E7D4F; --fw:#C63B3B; --enemy:#3A3F44;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior-y:none;}
  header.top{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:baseline;gap:10px;}
  .brand{font-weight:800;font-size:19px;letter-spacing:.08em;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .brand-sub{font-size:11px;color:rgba(255,255,255,.6);}
  main{padding:16px 14px 96px;max-width:560px;margin:0 auto;}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40;}
  nav.tabs button{flex:1;padding:10px 0 8px;background:none;border:none;border-top:2px solid transparent;color:var(--muted);font-family:inherit;cursor:pointer;}
  nav.tabs button.on{color:var(--blue);border-top-color:var(--blue);}
  nav.tabs .ico{font-size:18px;} nav.tabs .lbl{font-size:10px;font-weight:700;margin-top:2px;}
  .sec-en{font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1.1;text-transform:uppercase;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .sec-ja{font-size:12px;color:var(--muted);margin:2px 0 12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .in{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);outline:none;width:100%;}
  textarea.in{resize:vertical;}
  .btn{border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;}
  .btn.pri{background:var(--blue);color:#fff;}
  .btn.grn{background:var(--pitchA);color:#fff;}
  .btn.gho{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.dgr{background:transparent;color:var(--fw);border:1px solid var(--fw);}
  .btn:disabled{opacity:.4;}
  .chip{padding:5px 11px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;}
  .lbl-s{font-size:11px;color:var(--muted);}
  .row{display:flex;gap:8px;} .grow{flex:1;}
  .mut{color:var(--muted);}
  #pitch{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;touch-action:none;
    background:repeating-linear-gradient(0deg,var(--pitchA) 0 12.5%,var(--pitchB) 12.5% 25%);}
  .token{position:absolute;transform:translate(-50%,-50%);touch-action:none;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;-webkit-user-select:none;z-index:1;}
  .token .disc{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .token.guest .disc{border-style:dashed;}
  .token.sel .disc{border:3px solid #FFE24A;}
  .token .nm{margin-top:2px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:4px;padding:1px 5px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:none;max-height:75vh;overflow:auto;}
  #sheet.show{display:block;}
  table.rot{border-collapse:collapse;width:100%;font-size:12px;}
  table.rot th, table.rot td{padding:6px 6px;text-align:center;}
  table.rot td.nm, table.rot th.nm{text-align:left;padding:6px 10px;position:sticky;left:0;background:#fff;font-weight:700;white-space:nowrap;}
  table.rot thead tr{background:var(--bg);} table.rot thead th.nm{background:var(--bg);}
  table.rot tbody tr{border-top:1px solid var(--line);}
  .memrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);}
  .memrow:first-child{border-top:none;}
  .avatar{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
  .badge{color:#fff;border-radius:4px;font-size:10px;font-weight:800;padding:1px 5px;letter-spacing:.05em;}
  .subbadge{font-size:10px;border-radius:4px;padding:0 5px;font-weight:800;border:1px dashed;}
  .xbtn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px;}
  .mlist button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:#fff;border:none;border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit;text-align:left;font-size:14px;}
</style>
</head>
<body>
<header class="top">
  <div class="brand">SQUAD MANAGER</div>
  <div class="brand-sub">チーム運営ノート</div>
</header>
<main id="app"></main>
<div id="sheet"></div>
<nav class="tabs">
  <button id="tb-members" onclick="act.tab('members')"><div class="ico">👥</div><div class="lbl">メンバー</div></button>
  <button id="tb-board" onclick="act.tab('board')"><div class="ico">📋</div><div class="lbl">ボード</div></button>
  <button id="tb-rotation" onclick="act.tab('rotation')"><div class="ico">⏱</div><div class="lbl">出場時間</div></button>
</nav>

<script>
"use strict";
/* ================= data ================= */
var KEY = "soccer-squad-v2";
var POS_GROUPS = { GK:["GK"], DF:["CB","RB","LB","RWB","LWB"], MF:["CDM","CM","CAM","RM","LM"], FW:["ST","CF","RW","LW"] };
var ALL_POS = [].concat(POS_GROUPS.GK, POS_GROUPS.DF, POS_GROUPS.MF, POS_GROUPS.FW);
function groupOf(p){ for (var g in POS_GROUPS){ if (POS_GROUPS[g].indexOf(p) >= 0) return g; } return "MF"; }
var GC = { GK:"#E8A13A", DF:"#1B3C8C", MF:"#2E7D4F", FW:"#C63B3B" };
function pc(p){ return GC[groupOf(p)]; }

var FORMATIONS = {
  "4-4-2": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["RM",85,50],["CM",62,53],["CM",38,53],["LM",15,50],["ST",38,28],["ST",62,28]],
  "4-3-3": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["CM",30,52],["CDM",50,58],["CM",70,52],["RW",80,28],["ST",50,23],["LW",20,28]],
  "3-5-2": [["GK",50,91],["CB",28,74],["CB",50,77],["CB",72,74],["RWB",90,48],["CM",68,53],["CDM",50,58],["CM",32,53],["LWB",10,48],["ST",38,26],["ST",62,26]],
  "4-2-3-1": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["CDM",38,58],["CDM",62,58],["RM",80,40],["CAM",50,43],["LM",20,40],["ST",50,24]]
};

function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var S = { members: [], board: null };
try { var raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch(e){}
if (!S.members) S.members = [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

var ui = {
  tab: "members",
  mName: "", mPos: "CM", mSub: [],
  fname: (S.board && S.board.fname) || "4-4-2",
  editId: null,
  rot: { attend: [], field: 11, total: 60, seg: 6, gk: "" },
  rotResult: null
};

/* ================= render ================= */
function render(){
  var el = document.getElementById("app");
  if (ui.tab === "members") el.innerHTML = rMembers();
  else if (ui.tab === "board") el.innerHTML = rBoard();
  else el.innerHTML = rRotation();
  ["members","board","rotation"].forEach(function(t){
    document.getElementById("tb-" + t).className = (ui.tab === t) ? "on" : "";
  });
  if (ui.tab === "board") bindPitch();
  renderSheet();
}

/* ---------- members ---------- */
function rMembers(){
  var h = '<div class="sec-en">Squad List</div><div class="sec-ja">メンバー登録・削除</div>';
  h += '<div class="card" style="margin-bottom:14px">';
  h += '<input class="in" id="mname" placeholder="名前を入力" value="' + esc(ui.mName) + '" oninput="ui.mName=this.value">';
  h += '<div class="lbl-s" style="margin:12px 0 4px">メインポジション</div>';
  for (var g in POS_GROUPS){
    h += '<div style="display:flex;gap:5px;align-items:center;margin-bottom:6px;flex-wrap:wrap">';
    h += '<span style="font-size:10px;font-weight:800;width:24px;color:' + GC[g] + '">' + g + '</span>';
    POS_GROUPS[g].forEach(function(p){
      var on = ui.mPos === p;
      h += '<button class="chip" style="' + (on ? "border-color:" + GC[g] + ";background:" + GC[g] + ";color:#fff" : "") + '" onclick="act.mPos(\'' + p + '\')">' + p + '</button>';
    });
    h += '</div>';
  }
  h += '<div class="lbl-s" style="margin:10px 0 4px">サブポジション（複数可・タップで選択）</div><div style="display:flex;gap:5px;flex-wrap:wrap">';
  ALL_POS.forEach(function(p){
    if (p === ui.mPos) return;
    var on = ui.mSub.indexOf(p) >= 0;
    h += '<button class="chip" style="padding:4px 10px;font-size:11px;border-width:1px;border-style:dashed;' + (on ? "border-color:" + pc(p) + ";background:" + pc(p) + "18;color:" + pc(p) : "") + '" onclick="act.mSub(\'' + p + '\')">' + p + '</button>';
  });
  h += '</div><button class="btn pri" style="width:100%;margin-top:12px" onclick="act.addMember()">メンバーを追加</button></div>';

  if (S.members.length === 0){
    h += '<div style="text-align:center;color:var(--muted);font-size:13px;padding:30px">まだメンバーがいません。上から追加してください。</div>';
  } else {
    h += '<div class="card" style="padding:0;overflow:hidden">';
    S.members.forEach(function(m){
      h += '<div class="memrow"><div class="avatar" style="background:' + pc(m.pos) + '">' + esc(m.name.slice(0,1)) + '</div>';
      h += '<div class="grow" style="min-width:0"><div style="font-weight:700;font-size:14px">' + esc(m.name) + '</div>';
      h += '<div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap"><span class="badge" style="background:' + pc(m.pos) + '">' + m.pos + '</span>';
      (m.sub || []).forEach(function(s){
        h += '<span class="subbadge" style="color:' + pc(s) + ';border-color:' + pc(s) + '">' + s + '</span>';
      });
      h += '</div></div><button class="xbtn" onclick="act.delMember(\'' + m.id + '\')">×</button></div>';
    });
    h += '</div>';
  }
  return h;
}

/* ---------- board ---------- */
function rBoard(){
  var b = S.board || { fname: ui.fname, tokens: [], showEnemy: false };
  var h = '<div class="sec-en">Tactics Board</div><div class="sec-ja">フォーメーション作成・戦術ボード（11人制）</div>';
  h += '<div class="row" style="margin-bottom:8px"><select class="in grow" onchange="ui.fname=this.value">';
  Object.keys(FORMATIONS).forEach(function(k){
    h += '<option value="' + k + '"' + (ui.fname === k ? " selected" : "") + '>' + k + '</option>';
  });
  h += '</select><button class="btn grn" onclick="act.applyFormation()">自動配置</button></div>';
  h += '<div class="row" style="margin-bottom:10px">';
  h += '<button class="btn gho grow" onclick="act.addGuest()">＋ 助っ人を追加</button>';
  h += '<button class="btn ' + (b.showEnemy ? "pri" : "gho") + ' grow" onclick="act.toggleEnemy()">' + (b.showEnemy ? "相手チームを隠す" : "相手チームを表示") + '</button></div>';
  h += '<div class="lbl-s" style="margin-bottom:10px">駒をタップ → 選手の選択・助っ人の名前編集。ドラッグで自由に移動できます。</div>';
  h += '<div id="pitch">';
  h += '<svg viewBox="0 0 300 400" style="position:absolute;inset:0;width:100%;height:100%"><g stroke="rgba(255,255,255,.85)" stroke-width="2" fill="none"><rect x="8" y="8" width="284" height="384"/><line x1="8" y1="200" x2="292" y2="200"/><circle cx="150" cy="200" r="34"/><rect x="75" y="8" width="150" height="56"/><rect x="75" y="336" width="150" height="56"/><rect x="112" y="8" width="76" height="22"/><rect x="112" y="370" width="76" height="22"/></g></svg>';
  var allyCount = 0;
  (b.tokens || []).forEach(function(t){
    if (t.side === "ally") allyCount++;
    if (t.side === "enemy" && !b.showEnemy) return;
    var cls = "token" + (t.guest ? " guest" : "") + (t.id === ui.editId ? " sel" : "");
    var bg = t.side === "enemy" ? "var(--enemy)" : pc(t.pos);
    h += '<div class="' + cls + '" data-id="' + t.id + '" style="left:' + t.x + '%;top:' + t.y + '%">';
    h += '<div class="disc" style="background:' + bg + '">' + (t.side === "enemy" ? "敵" : t.pos) + '</div>';
    h += '<div class="nm">' + (t.guest ? "⚡" : "") + esc(t.name) + '</div></div>';
  });
  if (allyCount === 0){
    h += '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);font-size:13px">フォーメーションを選んで「自動配置」</div>';
  }
  h += '</div>';
  return h;
}

/* ---------- rotation ---------- */
function rRotation(){
  var h = '<div class="sec-en">Fair Play Time</div><div class="sec-ja">均等出場時間ローテーション自動作成</div>';
  h += '<div class="card" style="margin-bottom:12px"><div class="lbl-s" style="margin-bottom:8px">今日の参加者を選択（' + ui.rot.attend.length + '名）</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
  if (S.members.length === 0) h += '<span style="font-size:13px" class="mut">先にメンバーを登録してください</span>';
  S.members.forEach(function(m){
    var on = ui.rot.attend.indexOf(m.id) >= 0;
    h += '<button class="chip" style="font-size:13px;font-family:inherit;' + (on ? "border-color:var(--blue);background:var(--blue);color:#fff" : "") + '" onclick="act.rotToggle(\'' + m.id + '\')">' + esc(m.name) + '</button>';
  });
  h += '</div></div>';
  h += '<div class="card" style="margin-bottom:12px"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">';
  h += '<label class="lbl-s">同時出場人数<input class="in" type="number" min="1" value="' + ui.rot.field + '" oninput="ui.rot.field=+this.value" style="margin-top:4px"></label>';
  h += '<label class="lbl-s">試合時間(分)<input class="in" type="number" min="1" value="' + ui.rot.total + '" oninput="ui.rot.total=+this.value" style="margin-top:4px"></label>';
  h += '<label class="lbl-s">交代枠(分割数)<input class="in" type="number" min="1" value="' + ui.rot.seg + '" oninput="ui.rot.seg=+this.value" style="margin-top:4px"></label>';
  h += '</div><label class="lbl-s" style="display:block;margin-top:10px">固定GK（フル出場・任意）<select class="in" style="margin-top:4px" onchange="ui.rot.gk=this.value"><option value="">なし（GKも交代）</option>';
  S.members.forEach(function(m){
    if (ui.rot.attend.indexOf(m.id) < 0) return;
    h += '<option value="' + m.id + '"' + (ui.rot.gk === m.id ? " selected" : "") + '>' + esc(m.name) + '</option>';
  });
  h += '</select></label>';
  h += '<button class="btn grn" style="width:100%;margin-top:12px" ' + (ui.rot.attend.length === 0 ? "disabled" : "") + ' onclick="act.runRot()">ローテーション表を作成</button></div>';

  if (ui.rotResult){
    var r = ui.rotResult;
    var atts = S.members.filter(function(m){ return r.ids.indexOf(m.id) >= 0; });
    var times = atts.map(function(m){ return r.time[m.id]; });
    var maxT = Math.max.apply(null, times), minT = Math.min.apply(null, times);
    var diff = Math.round((maxT - minT) * 10) / 10;
    h += '<div class="card" style="padding:0;overflow:auto">';
    h += '<div style="padding:10px 14px;font-size:12px" class="mut">1枠 ' + (Math.round(r.segMin * 10) / 10) + '分 ／ 出場時間の差 最大 <b style="color:' + (maxT - minT > r.segMin ? "var(--fw)" : "var(--pitchA)") + '">' + diff + '分</b></div>';
    h += '<table class="rot"><thead><tr><th class="nm">選手</th>';
    r.grid.forEach(function(_, i){ h += '<th>' + (i + 1) + '</th>'; });
    h += '<th>分</th></tr></thead><tbody>';
    atts.forEach(function(m){
      h += '<tr><td class="nm">' + esc(m.name) + (r.gk === m.id ? " 🧤" : "") + '</td>';
      r.grid.forEach(function(seg){
        h += '<td>' + (seg.indexOf(m.id) >= 0 ? '<span style="color:var(--pitchA);font-weight:800">●</span>' : '<span style="color:var(--line)">−</span>') + '</td>';
      });
      h += '<td style="font-weight:800">' + Math.round(r.time[m.id]) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  return h;
}

/* ---------- bottom sheet (token editor) ---------- */
function renderSheet(){
  var el = document.getElementById("sheet");
  var b = S.board;
  var t = b && (b.tokens || []).find ? b.tokens.find(function(x){ return x.id === ui.editId; }) : null;
  if (!t){
    // Array.find フォールバック
    if (b && b.tokens){ for (var i = 0; i < b.tokens.length; i++){ if (b.tokens[i].id === ui.editId){ t = b.tokens[i]; break; } } }
  }
  if (!ui.editId || !t){ el.className = ""; el.innerHTML = ""; return; }
  var h = '<div style="display:flex;align-items:center;margin-bottom:12px"><div style="font-weight:700;font-size:15px" class="grow">' + (t.side === "enemy" ? "相手の駒を編集" : "この駒に選手を割り当て") + '</div><button class="xbtn" style="font-size:20px" onclick="act.closeSheet()">×</button></div>';
  if (t.side === "ally"){
    h += '<div class="lbl-s" style="margin-bottom:4px">ポジション表記</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px">';
    ALL_POS.forEach(function(p){
      var on = t.pos === p;
      h += '<button class="chip" style="padding:3px 8px;font-size:10px;border-width:1px;' + (on ? "border-color:" + pc(p) + ";background:" + pc(p) + ";color:#fff" : "") + '" onclick="act.tokenPos(\'' + p + '\')">' + p + '</button>';
    });
    h += '</div><div class="lbl-s" style="margin-bottom:4px">登録メンバーから選ぶ</div>';
    h += '<div class="mlist" style="max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px">';
    if (S.members.length === 0) h += '<div style="padding:12px;font-size:12px" class="mut">メンバー未登録です</div>';
    var assigned = {};
    (S.board.tokens || []).forEach(function(x){ if (x.memberId) assigned[x.memberId] = true; });
    S.members.forEach(function(m){
      h += '<button onclick="act.assignMember(\'' + m.id + '\')" style="' + (t.memberId === m.id ? "background:#1B3C8C12" : "") + '">';
      h += '<span class="badge" style="background:' + pc(m.pos) + '">' + m.pos + '</span><span class="grow" style="font-weight:700;font-size:13px">' + esc(m.name) + '</span>';
      if (assigned[m.id] && t.memberId !== m.id) h += '<span style="font-size:10px" class="mut">配置中→移動</span>';
      if (t.memberId === m.id) h += '<span style="font-size:11px;color:var(--blue);font-weight:800">✓</span>';
      h += '</button>';
    });
    h += '</div><div class="lbl-s" style="margin-bottom:4px">または助っ人の名前を入力</div>';
    h += '<div class="row" style="margin-bottom:12px"><input class="in grow" id="guestname" placeholder="例: 田中（助っ人）"><button class="btn grn" onclick="act.setGuest()">設定</button></div>';
    h += '<div class="row"><button class="btn gho grow" onclick="act.clearToken()">未定に戻す</button>';
    if (t.guest) h += '<button class="btn dgr grow" onclick="act.deleteToken()">駒を削除</button>';
    h += '</div>';
  } else {
    h += '<div class="row" style="margin-bottom:12px"><input class="in grow" id="guestname" placeholder="' + esc(t.name) + '"><button class="btn pri" onclick="act.renameEnemy()">名前変更</button></div>';
    h += '<button class="btn dgr" style="width:100%" onclick="act.deleteToken()">この駒を削除</button>';
  }
  el.innerHTML = h;
  el.className = "show";
}

/* ================= rotation algorithm ================= */
function buildRotation(players, fieldCount, totalMin, segments, gkId){
  var segMin = totalMin / segments;
  var time = {}, lastOn = {};
  players.forEach(function(p){ time[p.id] = 0; lastOn[p.id] = -99; });
  var grid = [];
  var hasGk = gkId && players.some(function(p){ return p.id === gkId; });
  for (var s = 0; s < segments; s++){
    var pool = players.filter(function(p){ return !hasGk || p.id !== gkId; });
    var need = Math.min(pool.length, fieldCount - (hasGk ? 1 : 0));
    pool.sort(function(a, b){
      return (time[a.id] - time[b.id]) || (lastOn[a.id] - lastOn[b.id]) || (a._r - b._r);
    });
    var on = pool.slice(0, need).map(function(p){ return p.id; });
    if (hasGk) on.unshift(gkId);
    on.forEach(function(id){ time[id] += segMin; lastOn[id] = s; });
    grid.push(on);
  }
  return { grid: grid, time: time, segMin: segMin };
}

/* ================= actions ================= */
var act = {
  tab: function(t){ ui.tab = t; ui.editId = null; render(); },

  /* members */
  mPos: function(p){
    ui.mPos = p;
    ui.mSub = ui.mSub.filter(function(x){ return x !== p; });
    render();
  },
  mSub: function(p){
    var i = ui.mSub.indexOf(p);
    if (i >= 0) ui.mSub.splice(i, 1); else ui.mSub.push(p);
    render();
  },
  addMember: function(){
    var n = (document.getElementById("mname").value || "").trim();
    if (!n) return;
    S.members.push({ id: uid(), name: n, pos: ui.mPos, sub: ui.mSub.slice() });
    ui.mName = ""; ui.mSub = [];
    save(); render();
  },
  delMember: function(id){
    if (!confirm("このメンバーを削除しますか？")) return;
    S.members = S.members.filter(function(m){ return m.id !== id; });
    ui.rot.attend = ui.rot.attend.filter(function(x){ return x !== id; });
    save(); render();
  },

  /* board */
  applyFormation: function(){
    var slots = FORMATIONS[ui.fname];
    var used = {};
    function pick(p){
      var g = groupOf(p);
      var tests = [
        function(m){ return m.pos === p; },
        function(m){ return (m.sub || []).indexOf(p) >= 0; },
        function(m){ return groupOf(m.pos) === g; },
        function(m){ return (m.sub || []).some(function(s){ return groupOf(s) === g; }); },
        function(){ return true; }
      ];
      for (var i = 0; i < tests.length; i++){
        for (var j = 0; j < S.members.length; j++){
          var m = S.members[j];
          if (!used[m.id] && tests[i](m)){ used[m.id] = true; return m; }
        }
      }
      return null;
    }
    var ally = slots.map(function(sl){
      var m = pick(sl[0]);
      return { id: uid(), side: "ally", pos: sl[0], x: sl[1], y: sl[2], memberId: m ? m.id : null, name: m ? m.name : "未定", guest: false };
    });
    var enemies = (S.board && S.board.tokens || []).filter(function(t){ return t.side === "enemy"; });
    S.board = { fname: ui.fname, tokens: ally.concat(enemies), showEnemy: S.board ? S.board.showEnemy : false };
    ui.editId = null;
    save(); render();
  },
  toggleEnemy: function(){
    if (!S.board) S.board = { fname: ui.fname, tokens: [], showEnemy: false };
    var hasEnemy = S.board.tokens.some(function(t){ return t.side === "enemy"; });
    if (!S.board.showEnemy && !hasEnemy){
      FORMATIONS["4-4-2"].forEach(function(sl, i){
        S.board.tokens.push({ id: uid(), side: "enemy", pos: sl[0], x: 100 - sl[1], y: 100 - sl[2], name: "相手" + (i + 1), memberId: null, guest: false });
      });
      S.board.showEnemy = true;
    } else {
      S.board.showEnemy = !S.board.showEnemy;
    }
    save(); render();
  },
  addGuest: function(){
    if (!S.board) S.board = { fname: ui.fname, tokens: [], showEnemy: false };
    S.board.tokens.push({ id: uid(), side: "ally", pos: "CM", x: 50, y: 50, memberId: null, name: "助っ人", guest: true });
    save(); render();
  },
  closeSheet: function(){ ui.editId = null; render(); },
  tokenPos: function(p){
    tok(ui.editId).pos = p;
    save(); render();
  },
  assignMember: function(mid){
    var m = null;
    S.members.forEach(function(x){ if (x.id === mid) m = x; });
    if (!m) return;
    S.board.tokens.forEach(function(t){
      if (t.id === ui.editId){ t.memberId = m.id; t.name = m.name; t.guest = false; }
      else if (t.memberId === m.id){ t.memberId = null; t.name = "未定"; }
    });
    ui.editId = null;
    save(); render();
  },
  setGuest: function(){
    var n = (document.getElementById("guestname").value || "").trim();
    if (!n) return;
    var t = tok(ui.editId);
    t.memberId = null; t.name = n; t.guest = true;
    ui.editId = null;
    save(); render();
  },
  renameEnemy: function(){
    var n = (document.getElementById("guestname").value || "").trim();
    if (!n) return;
    tok(ui.editId).name = n;
    ui.editId = null;
    save(); render();
  },
  clearToken: function(){
    var t = tok(ui.editId);
    t.memberId = null; t.name = "未定"; t.guest = false;
    ui.editId = null;
    save(); render();
  },
  deleteToken: function(){
    S.board.tokens = S.board.tokens.filter(function(t){ return t.id !== ui.editId; });
    ui.editId = null;
    save(); render();
  },

  /* rotation */
  rotToggle: function(id){
    var i = ui.rot.attend.indexOf(id);
    if (i >= 0){
      ui.rot.attend.splice(i, 1);
      if (ui.rot.gk === id) ui.rot.gk = "";
    } else ui.rot.attend.push(id);
    render();
  },
  runRot: function(){
    var players = S.members.filter(function(m){ return ui.rot.attend.indexOf(m.id) >= 0; })
      .map(function(m){ return { id: m.id, _r: Math.random() }; });
    if (!players.length) return;
    var r = buildRotation(players, ui.rot.field, ui.rot.total, ui.rot.seg, ui.rot.gk || null);
    r.ids = players.map(function(p){ return p.id; });
    r.gk = ui.rot.gk || null;
    ui.rotResult = r;
    render();
  }
};

function tok(id){
  for (var i = 0; i < S.board.tokens.length; i++){ if (S.board.tokens[i].id === id) return S.board.tokens[i]; }
  return {};
}

/* ================= pitch drag & tap ================= */
function bindPitch(){
  var pitch = document.getElementById("pitch");
  if (!pitch) return;
  var drag = null;
  pitch.addEventListener("pointerdown", function(e){
    var el = e.target.closest(".token");
    if (!el) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    drag = { id: el.getAttribute("data-id"), el: el, sx: e.clientX, sy: e.clientY, moved: false };
  });
  pitch.addEventListener("pointermove", function(e){
    if (!drag) return;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6) drag.moved = true;
    if (!drag.moved) return;
    var r = pitch.getBoundingClientRect();
    var x = Math.max(2, Math.min(98, (e.clientX - r.left) / r.width * 100));
    var y = Math.max(2, Math.min(98, (e.clientY - r.top) / r.height * 100));
    drag.el.style.left = x + "%";
    drag.el.style.top = y + "%";
    var t = tok(drag.id); t.x = x; t.y = y;
  });
  function up(){
    if (!drag) return;
    if (drag.moved){ save(); }
    else { ui.editId = drag.id; renderSheet(); rerenderSel(); }
    drag = null;
  }
  pitch.addEventListener("pointerup", up);
  pitch.addEventListener("pointercancel", up);
}
function rerenderSel(){
  document.querySelectorAll(".token").forEach(function(el){
    if (el.getAttribute("data-id") === ui.editId) el.classList.add("sel");
    else el.classList.remove("sel");
  });
}

/* ================= boot ================= */
render();
if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
