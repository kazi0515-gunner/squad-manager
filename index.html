<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SQUAD MANAGER</title>
<meta name="theme-color" content="#16211B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Squad">
<style>
  :root{
    --bg:#EFF2ED; --card:#fff; --ink:#16211B; --muted:#66736B; --line:#DDE3DC;
    --pitchA:#2E7D4F; --pitchB:#297246; --blue:#1B3C8C;
    --gk:#E8A13A; --df:#1B3C8C; --mf:#2E7D4F; --fw:#C63B3B; --enemy:#3A3F44;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior-y:none;}
  header.top{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:baseline;gap:10px;}
  .brand{font-weight:800;font-size:19px;letter-spacing:.08em;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .brand-sub{font-size:11px;color:rgba(255,255,255,.6);}
  main{padding:14px 12px 96px;max-width:560px;margin:0 auto;}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40;}
  nav.tabs button{flex:1;padding:10px 0 8px;background:none;border:none;border-top:2px solid transparent;color:var(--muted);font-family:inherit;cursor:pointer;}
  nav.tabs button.on{color:var(--blue);border-top-color:var(--blue);}
  nav.tabs .ico{font-size:18px;} nav.tabs .lbl{font-size:10px;font-weight:700;margin-top:2px;}
  .sec-en{font-weight:800;font-size:22px;letter-spacing:.04em;line-height:1.1;text-transform:uppercase;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .sec-ja{font-size:12px;color:var(--muted);margin:2px 0 12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .in{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);outline:none;width:100%;}
  .btn{border-radius:8px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;}
  .btn.pri{background:var(--blue);color:#fff;}
  .btn.grn{background:var(--pitchA);color:#fff;}
  .btn.gho{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.dgr{background:transparent;color:var(--fw);border:1px solid var(--fw);}
  .btn.sm{padding:8px 6px;font-size:12px;}
  .btn:disabled{opacity:.4;}
  .chip{padding:5px 11px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;}
  .lbl-s{font-size:11px;color:var(--muted);}
  .row{display:flex;gap:8px;} .grow{flex:1;}
  .mut{color:var(--muted);}
  .acc-h{width:100%;padding:11px 14px;background:none;border:none;display:flex;align-items:center;cursor:pointer;font-family:inherit;}
  .acc-h .t{font-weight:700;font-size:13px;flex:1;text-align:left;}
  #pitch{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;touch-action:none;
    background:repeating-linear-gradient(0deg,var(--pitchA) 0 12.5%,var(--pitchB) 12.5% 25%);}
  .token{position:absolute;transform:translate(-50%,-50%);touch-action:none;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;-webkit-user-select:none;z-index:1;}
  .token .disc{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .token.guest .disc{border-style:dashed;}
  .token.sel .disc{border:3px solid #FFE24A;}
  .token .nm{margin-top:2px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:4px;padding:1px 5px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #benchbar{position:absolute;left:6px;top:6px;bottom:6px;width:58px;background:rgba(0,0,0,.3);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 0;overflow-y:auto;z-index:2;touch-action:pan-y;}
  .btok{background:none;border:none;cursor:grab;display:flex;flex-direction:column;align-items:center;padding:0;font-family:inherit;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex-shrink:0;}
  .btok.lifted{opacity:.35;}
  .token.target .disc{border:3px solid #FFE24A;transform:scale(1.15);}
  .btok .disc{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:9px;}
  .btok.guest .disc{border-style:dashed;}
  .btok .nm{margin-top:1px;font-size:8px;font-weight:700;color:#fff;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:none;max-height:78vh;overflow:auto;}
  #sheet.show{display:block;}
  table.rot{border-collapse:collapse;width:100%;font-size:12px;}
  table.rot th, table.rot td{padding:6px 5px;text-align:center;}
  table.rot td.nm, table.rot th.nm{text-align:left;padding:6px 10px;position:sticky;left:0;background:#fff;font-weight:700;white-space:nowrap;font-size:11px;}
  table.rot thead tr{background:var(--bg);} table.rot thead th.nm{background:var(--bg);}
  table.rot tbody tr{border-top:1px solid var(--line);}
  table.rot td.cell{cursor:pointer;}
  .memrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);background:#fff;}
  .memrow:first-child{border-top:none;}
  .memrow.dragging{opacity:.45;}
  .dragh{touch-action:none;cursor:grab;color:var(--muted);font-size:18px;padding:8px 6px;user-select:none;-webkit-user-select:none;}
  .avatar{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;}
  .badge{color:#fff;border-radius:4px;font-size:10px;font-weight:800;padding:1px 5px;letter-spacing:.05em;}
  .subbadge{font-size:10px;border-radius:4px;padding:0 5px;font-weight:800;border:1px dashed;}
  .xbtn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px;}
  .mlist button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:#fff;border:none;border-bottom:1px solid var(--line);cursor:pointer;font-family:inherit;text-align:left;font-size:14px;}
  .optrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap;}
  .optrow select,.optrow input{border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px;font-family:inherit;background:#fff;}
  .minipitch{display:block;width:100%;height:auto;border-radius:10px;}
  .pchip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;margin:2px;}
</style>
</head>
<body>
<header class="top">
  <div class="brand">SQUAD MANAGER</div>
  <div class="brand-sub">チーム運営ノート</div>
</header>
<main id="app"></main>
<div id="sheet"></div>
<nav class="tabs">
  <button id="tb-members" onclick="act.tab('members')"><div class="ico">👥</div><div class="lbl">メンバー</div></button>
  <button id="tb-rotation" onclick="act.tab('rotation')"><div class="ico">⏱</div><div class="lbl">出場時間</div></button>
  <button id="tb-board" onclick="act.tab('board')"><div class="ico">📋</div><div class="lbl">ボード</div></button>
</nav>

<script>
"use strict";
/* ================= constants ================= */
var KEY = "soccer-squad-v2";
var POS_GROUPS = { GK:["GK"], DF:["CB","RB","LB","RWB","LWB"], MF:["CDM","CM","CAM","RM","LM"], FW:["ST","CF","RW","LW"] };
var ALL_POS = [].concat(POS_GROUPS.GK, POS_GROUPS.DF, POS_GROUPS.MF, POS_GROUPS.FW);
function groupOf(p){ for (var g in POS_GROUPS){ if (POS_GROUPS[g].indexOf(p) >= 0) return g; } return "MF"; }
var GC = { GK:"#E8A13A", DF:"#1B3C8C", MF:"#2E7D4F", FW:"#C63B3B" };
function pc(p){ if (p === "LWB" || p === "RWB") return GC.MF; return GC[groupOf(p)]; }

var FORMATIONS = {
  "4-4-2": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["RM",85,50],["CM",62,53],["CM",38,53],["LM",15,50],["ST",38,28],["ST",62,28]],
  "4-3-3": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["CM",30,52],["CDM",50,58],["CM",70,52],["RW",80,28],["ST",50,23],["LW",20,28]],
  "3-5-2": [["GK",50,91],["CB",28,74],["CB",50,77],["CB",72,74],["RWB",90,48],["CM",68,53],["CDM",50,58],["CM",32,53],["LWB",10,48],["ST",38,26],["ST",62,26]],
  "4-2-3-1": [["GK",50,91],["RB",85,72],["CB",62,75],["CB",38,75],["LB",15,72],["CDM",38,58],["CDM",62,58],["RM",80,40],["CAM",50,43],["LM",20,40],["ST",50,24]],
  "4-1-4-1": [["GK",50,91],["RB",85,73],["CB",62,76],["CB",38,76],["LB",15,73],["CDM",50,60],["RM",84,45],["CM",62,47],["CM",38,47],["LM",16,45],["ST",50,24]],
  "4-5-1": [["GK",50,91],["RB",85,73],["CB",62,76],["CB",38,76],["LB",15,73],["RM",86,50],["CM",66,54],["CDM",50,58],["CM",34,54],["LM",14,50],["ST",50,26]],
  "4-4-1-1": [["GK",50,91],["RB",85,73],["CB",62,76],["CB",38,76],["LB",15,73],["RM",85,52],["CM",62,55],["CM",38,55],["LM",15,52],["CAM",50,36],["ST",50,20]],
  "3-4-3": [["GK",50,91],["CB",28,75],["CB",50,78],["CB",72,75],["RM",86,52],["CM",62,55],["CM",38,55],["LM",14,52],["RW",78,27],["ST",50,22],["LW",22,27]],
  "3-4-2-1": [["GK",50,91],["CB",28,75],["CB",50,78],["CB",72,75],["RWB",88,52],["CM",62,56],["CM",38,56],["LWB",12,52],["CAM",66,34],["CAM",34,34],["ST",50,20]],
  "5-3-2": [["GK",50,91],["RWB",90,66],["CB",70,77],["CB",50,80],["CB",30,77],["LWB",10,66],["CM",68,50],["CDM",50,55],["CM",32,50],["ST",38,26],["ST",62,26]],
  "5-4-1": [["GK",50,91],["RWB",90,66],["CB",70,77],["CB",50,80],["CB",30,77],["LWB",10,66],["RM",80,48],["CM",60,52],["CM",40,52],["LM",20,48],["ST",50,24]],
  "4-3-1-2": [["GK",50,91],["RB",85,73],["CB",62,76],["CB",38,76],["LB",15,73],["CM",76,54],["CDM",50,58],["CM",24,54],["CAM",50,38],["ST",36,22],["ST",64,22]],
  "3-1-4-2": [["GK",50,91],["CB",28,76],["CB",50,79],["CB",72,76],["CDM",50,62],["RM",88,48],["CM",64,50],["CM",36,50],["LM",12,48],["ST",38,24],["ST",62,24]]
};
var TIME_PRESETS = [["20分×2本",40,2],["25分×2本",50,2],["30分×2本",60,2],["30分×3本",90,3],["40分×2本",80,2],["45分×2本",90,2]];

function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function memLabel(m){ return (m.num ? "#" + m.num + " " : "") + m.name; }
function primaryPositions(m){ return (m.poss && m.poss.length) ? m.poss : (m.pos ? [m.pos] : []); }
function primaryPos(m){ var p = primaryPositions(m); return p[0] || "CM"; }
function assignByPriority(slotPosArr, cand){
  /* slotPosArr: 各枠のポジション文字列 / cand: メンバー配列。①メイン②サブ③メイン同系統④サブ同系統⑤その他 の順で全枠横断的に割当 */
  var res = new Array(slotPosArr.length), used = {};
  var tests = [
    function(m, p){ return primaryPositions(m).indexOf(p) >= 0; },
    function(m, p){ return (m.sub || []).indexOf(p) >= 0; },
    function(m, p){ return primaryPositions(m).some(function(pp){ return groupOf(pp) === groupOf(p); }); },
    function(m, p){ return (m.sub || []).some(function(s){ return groupOf(s) === groupOf(p); }); },
    function(){ return true; }
  ];
  for (var t = 0; t < tests.length; t++){
    for (var i = 0; i < slotPosArr.length; i++){
      if (res[i]) continue;
      for (var j = 0; j < cand.length; j++){
        var m = cand[j];
        if (!m || used[m.id]) continue;
        if (tests[t](m, slotPosArr[i])){ res[i] = m; used[m.id] = true; break; }
      }
    }
  }
  return { res: res, used: used };
}
function memById(id){
  for (var i = 0; i < S.members.length; i++){ if (S.members[i].id === id) return S.members[i]; }
  var g = ui.rot.guests || [];
  for (var j = 0; j < g.length; j++){ if (g[j].id === id) return g[j]; }
  return null;
}
function roster(){ return S.members.concat(ui.rot.guests || []); }
function evLabel(ev){
  var d = ev.date ? ev.date.replace(/^\d{4}-/, "").replace("-", "/") : "日付未設定";
  return d + " vs " + (ev.opponent || "未定");
}

/* ================= state ================= */
var S = { members: [], board: null, custom: {}, timePresets: [], events: [] };
try { var raw = localStorage.getItem(KEY); if (raw){ var d = JSON.parse(raw); for (var k in d) S[k] = d[k]; } } catch(e){}
if (!S.members) S.members = [];
S.members.forEach(function(m){ if (!m.poss || !m.poss.length) m.poss = m.pos ? [m.pos] : ["CM"]; if (!m.pos) m.pos = m.poss[0]; });
if (!S.custom) S.custom = {};
if (!S.timePresets) S.timePresets = [];
if (!S.events) S.events = [];
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

var ui = {
  tab: "members",
  mName: "", mNum: "", mPoss: ["CM"], mSub: [], mGuest: false,
  fname: (S.board && S.board.fname) || "4-4-2",
  sheet: null,
  rot: { attend: [], field: 11, total: 60, seg: 4, gk: "", gks: [], opts: {}, guests: [], presetIdx: null },
  eventId: null, evForm: null, showEvents: false, evEditMode: false,
  rotResult: null,
  showOpts: false, showAttend: true, rotView: "table", showNames: false, shotCols: null,
  em: null
};

function getSlots(name){ return FORMATIONS[name] || S.custom[name] || FORMATIONS["4-4-2"]; }
function allFormationNames(){ return Object.keys(FORMATIONS).concat(Object.keys(S.custom)); }
function compress(y){ return 52 + y * 0.46; }
function expand(y){ return Math.max(2, Math.min(98, (y - 52) / 0.46)); }
function board(){ if (!S.board) S.board = { fname: ui.fname, tokens: [], bench: [], showEnemy: false, showBench: false }; if (!S.board.bench) S.board.bench = []; return S.board; }
function clampTokenY(t, y){
  if (board().showEnemy){
    if (t.side === "ally") return Math.max(52, Math.min(98, y));
    if (t.side === "enemy") return Math.max(2, Math.min(48, y));
  }
  return Math.max(2, Math.min(98, y));
}

/* ================= render ================= */
function render(){
  var el = document.getElementById("app");
  if (ui.tab === "members") el.innerHTML = rMembers();
  else if (ui.tab === "board") el.innerHTML = rBoard();
  else el.innerHTML = rRotation();
  ["members","board","rotation"].forEach(function(t){
    document.getElementById("tb-" + t).className = (ui.tab === t) ? "on" : "";
  });
  if (ui.tab === "board") bindPitch();
  if (ui.tab === "members") bindMemberDrag();
  renderSheet();
}

/* ---------- members ---------- */
function posChipsMulti(arr, handler){
  var h = "";
  for (var g in POS_GROUPS){
    h += '<div style="display:flex;gap:5px;align-items:center;margin-bottom:6px;flex-wrap:wrap">';
    h += '<span style="font-size:10px;font-weight:800;width:26px;color:' + GC[g] + '">' + g + '</span>';
    POS_GROUPS[g].forEach(function(p){
      var on = arr.indexOf(p) >= 0;
      h += '<button class="chip" style="' + (on ? "border-color:" + pc(p) + ";background:" + pc(p) + ";color:#fff" : "") + '" onclick="' + handler + '(\'' + p + '\')">' + p + '</button>';
    });
    h += '</div>';
  }
  return h;
}
function subChips(mainArr, subs, handler){
  var h = '<div style="display:flex;gap:5px;flex-wrap:wrap">';
  ALL_POS.forEach(function(p){
    if (mainArr.indexOf(p) >= 0) return;
    var on = subs.indexOf(p) >= 0;
    h += '<button class="chip" style="padding:4px 10px;font-size:11px;border-width:1px;border-style:dashed;' + (on ? "border-color:" + pc(p) + ";background:" + pc(p) + "18;color:" + pc(p) : "") + '" onclick="' + handler + '(\'' + p + '\')">' + p + '</button>';
  });
  return h + '</div>';
}
function rMembers(){
  var h = '<div class="sec-en">Squad List</div><div class="sec-ja">メンバー登録・編集・並べ替え</div>';
  h += '<div class="card" style="margin-bottom:14px">';
  h += '<div class="row"><input class="in grow" id="mname" placeholder="名前を入力" value="' + esc(ui.mName) + '" oninput="ui.mName=this.value">';
  h += '<input class="in" id="mnum" type="number" placeholder="背番号" style="width:88px" value="' + esc(ui.mNum) + '" oninput="ui.mNum=this.value"></div>';
  h += '<div class="lbl-s" style="margin:12px 0 4px">メインポジション（複数可）</div>' + posChipsMulti(ui.mPoss, "act.mPos");
  h += '<div class="lbl-s" style="margin:10px 0 4px">サブポジション（複数可）</div>' + subChips(ui.mPoss, ui.mSub, "act.mSub");
  h += '<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer"><input type="checkbox"' + (ui.mGuest ? " checked" : "") + ' onchange="ui.mGuest=this.checked;render()" style="width:18px;height:18px"> ⚡ 助っ人として登録（よく来る助っ人を保存）</label>';
  h += '<button class="btn pri" style="width:100%;margin-top:12px" onclick="act.addMember()">' + (ui.mGuest ? "助っ人" : "メンバー") + 'を追加</button></div>';

  if (S.members.length === 0){
    h += '<div style="text-align:center;color:var(--muted);font-size:13px;padding:30px">まだメンバーがいません。上から追加してください。</div>';
  } else {
    h += '<div class="lbl-s" style="margin:0 0 6px 2px">タップで編集 ／ 右端の ≡ を押したままドラッグで並べ替え</div>';
    h += '<div class="card" style="padding:0;overflow:hidden"><div id="memlist">';
    S.members.forEach(function(m){
      h += '<div class="memrow" data-id="' + m.id + '">';
      h += '<div class="grow" style="display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer" onclick="act.editMember(\'' + m.id + '\')">';
      var mp = primaryPositions(m);
      h += '<div class="avatar" style="background:' + pc(mp[0]) + '">' + (m.num ? esc(m.num) : esc(m.name.slice(0,1))) + '</div>';
      h += '<div class="grow" style="min-width:0"><div style="font-weight:700;font-size:14px">' + (m.isGuest ? "⚡ " : "") + esc(m.name) + '</div>';
      h += '<div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap">';
      mp.forEach(function(p){ h += '<span class="badge" style="background:' + pc(p) + '">' + p + '</span>'; });
      (m.sub || []).forEach(function(s){
        h += '<span class="subbadge" style="color:' + pc(s) + ';border-color:' + pc(s) + '">' + s + '</span>';
      });
      h += '</div></div></div>';
      h += '<span class="dragh" data-id="' + m.id + '">≡</span></div>';
    });
    h += '</div></div>';
  }
  return h;
}

/* ---------- board ---------- */
function rBoard(){
  var b = board();
  var h = '<div class="sec-en">Tactics Board</div><div class="sec-ja">編成・入れ替え・ローテーション作成</div>';
  /* 試合選択（出場時間タブで保存した参加者を反映） */
  h += '<div class="card" style="margin-bottom:8px;padding:10px 12px">';

/* ---------- rotation ---------- */
function gkIds(){
  /* GK枠を回す選手。未設定なら参加GKを自動採用 */
  var list = (ui.rot.gks || []).filter(function(id){ return ui.rot.attend.indexOf(id) >= 0; });
  return list;
}
function stepMin(){
  var t = ui.rot.total;
  if (t % 15 === 0) return 15;      /* 60,90 など → 15分刻み */
  if (t % 20 === 0) return 20;      /* 80,40 など → 20分刻み */
  if (t % 10 === 0) return 10;
  return 15;
}
function fixedMin(id){
  var gk = gkIds();
  if (gk.indexOf(id) >= 0){ var st = stepMin(); return Math.round(ui.rot.total / gk.length / st) * st; } /* GK枠を均等按分 */
  var o = ui.rot.opts[id] || {};
  return o.tmin ? o.tmin : null;
}
function estMinutes(){
  var N = ui.rot.attend.length;
  if (!N) return { map: {}, fixed: 0, remain: 0, freeN: 0 };
  var base = ui.rot.field * ui.rot.total;
  var gk = gkIds();
  var fixedSum = 0, freeIds = [], wsum = 0;
  ui.rot.attend.forEach(function(id){
    var o = ui.rot.opts[id] || {};
    if (gk.indexOf(id) >= 0){ fixedSum += fixedMin(id); return; }
    var tm = fixedMin(id);
    if (tm != null){ fixedSum += tm; }
    else { freeIds.push(id); wsum += (o.w === "hi" ? 1.4 : o.w === "lo" ? 0.6 : 1); }
  });
  var remain = Math.max(0, base - fixedSum);
  var out = {};
  ui.rot.attend.forEach(function(id){
    var o = ui.rot.opts[id] || {};
    var tm = fixedMin(id);
    var e;
    if (tm != null) e = tm;
    else { var w = (o.w === "hi" ? 1.4 : o.w === "lo" ? 0.6 : 1); e = wsum ? remain * w / wsum : 0; }
    var avail = ui.rot.total * (ui.rot.seg - ((o.from || 1) - 1)) / ui.rot.seg;
    e = Math.min(e, avail, ui.rot.total);
    var st = stepMin(); out[id] = Math.round(e / st) * st;
  });
  return { map: out, fixed: fixedSum, remain: remain, freeN: freeIds.length };
}

function baseLayout(){
  var ev = null;
  if (ui.eventId) S.events.forEach(function(x){ if (x.id === ui.eventId) ev = x; });
  var srcB = ev || S.board;
  var slots = [];
  if (srcB && srcB.tokens){
    srcB.tokens.forEach(function(t){
      if (t.side !== "ally") return;
      slots.push({ pos: t.pos, x: t.x, y: srcB.showEnemy ? expand(t.y) : t.y, memberId: t.memberId });
    });
  }
  if (!slots.length){
    getSlots(ui.fname).forEach(function(sl){ slots.push({ pos: sl[0], x: sl[1], y: sl[2], memberId: null }); });
  }
  return slots;
}
function assignLineup(lineup, slots, gkId, ov){
  var result = new Array(slots.length);
  var rest = lineup.slice();
  function take(i){ var id = rest[i]; rest.splice(i, 1); return id; }
  /* 手動指定を最優先 */
  if (ov){
    for (var oi in ov){
      var pid = ov[oi], k2 = rest.indexOf(pid);
      if (k2 >= 0 && slots[oi]){ result[oi] = pid; rest.splice(k2, 1); }
    }
  }
  /* GKを最優先で固定 */
  if (gkId && rest.indexOf(gkId) >= 0){
    for (var g = 0; g < slots.length; g++){
      if (slots[g].pos === "GK"){ result[g] = gkId; rest.splice(rest.indexOf(gkId), 1); break; }
    }
  }
  /* 元の位置を維持 */
  slots.forEach(function(s, i){
    if (result[i] || !s.memberId) return;
    var k = rest.indexOf(s.memberId);
    if (k >= 0) result[i] = take(k);
  });
  /* 残りをポジション適性で埋める */
  slots.forEach(function(s, i){
    if (result[i] || !rest.length) return;
    var grp = groupOf(s.pos), pick = -1, j, m;
    for (j = 0; j < rest.length; j++){ m = memById(rest[j]); if (m && primaryPositions(m).indexOf(s.pos) >= 0){ pick = j; break; } }
    if (pick < 0) for (j = 0; j < rest.length; j++){ m = memById(rest[j]); if (m && (m.sub || []).indexOf(s.pos) >= 0){ pick = j; break; } }
    if (pick < 0) for (j = 0; j < rest.length; j++){ m = memById(rest[j]); if (m && primaryPositions(m).some(function(pp){ return groupOf(pp) === grp; }) && s.pos !== "GK"){ pick = j; break; } }
    if (pick < 0 && s.pos !== "GK") pick = 0;
    if (pick < 0 && rest.length) pick = 0;
    if (pick >= 0) result[i] = take(pick);
  });
  var out = [];
  slots.forEach(function(s, i){ if (result[i]) out.push({ id: result[i], pos: s.pos, x: s.x, y: s.y, si: i }); });
  rest.forEach(function(id, i){
    out.push({ id: id, pos: "SUB", x: 12 + i * 14, y: 97, si: -1 });
  });
  return out;
}
function blockPlacement(key, lineup, gkId){
  var r = ui.rotResult;
  var ov = (r && r.layout) ? r.layout[key] : null;
  return assignLineup(lineup, baseLayout(), gkId, ov);
}
function curGk(lineup){
  var r = ui.rotResult;
  if (!r || !r.gks) return null;
  for (var i = 0; i < r.gks.length; i++){ if (lineup.indexOf(r.gks[i]) >= 0) return r.gks[i]; }
  return null;
}
function pitchBody(placed, gkId, inIds, key, clickable){
  var W = 300, H = 350, s = "";
  for (var i = 0; i < 8; i++){
    s += '<rect x="0" y="' + (i * 43.75) + '" width="300" height="43.76" fill="' + (i % 2 ? "#297246" : "#2E7D4F") + '"/>';
  }
  s += '<g stroke="rgba(255,255,255,.8)" stroke-width="2" fill="none">';
  s += '<rect x="6" y="6" width="288" height="338" rx="2"/><line x1="6" y1="175" x2="294" y2="175"/><circle cx="150" cy="175" r="30"/>';
  s += '<rect x="80" y="6" width="140" height="46"/><rect x="80" y="298" width="140" height="46"/>';
  s += '<rect x="112" y="6" width="76" height="18"/><rect x="112" y="326" width="76" height="18"/></g>';
  placed.forEach(function(p){
    var m = memById(p.id);
    var nm = (m ? m.name : "?") + (gkId === p.id ? "🧤" : "");
    var lab = (m && m.num) ? String(m.num) : (p.pos === "SUB" ? "＋" : p.pos);
    var col = p.pos === "SUB" ? "#6B7480" : pc(p.pos);
    var isIn = inIds && inIds.indexOf(p.id) >= 0;
    var cx = Math.round(p.x * 3), cy = Math.round(p.y * 3.5);
    if (cy > H - 26) cy = H - 26;
    if (cx < 20) cx = 20;
    if (cx > W - 20) cx = W - 20;
    var fs = lab.length > 2 ? 8 : 11;
    var nw = nm.replace(/[\u0020-\u007e]/g, "  ").length * 5 + 8;
    s += clickable ? '<g style="cursor:pointer" onclick="act.slotTap(\'' + key + '\',' + p.si + ')">' : '<g>';
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="12" fill="' + col + '" stroke="' + (isIn ? "#FFE24A" : "#ffffff") + '" stroke-width="' + (isIn ? 3 : 2) + '"/>';
    s += '<text x="' + cx + '" y="' + (cy + 4) + '" font-size="' + fs + '" font-weight="700" fill="#fff" text-anchor="middle" font-family="Avenir Next Condensed, Arial Narrow, sans-serif">' + esc(lab) + '</text>';
    s += '<rect x="' + (cx - nw / 2) + '" y="' + (cy + 14) + '" width="' + nw + '" height="13" rx="3" fill="rgba(0,0,0,.55)"/>';
    s += '<text x="' + cx + '" y="' + (cy + 23.5) + '" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">' + esc(nm) + '</text>';
    s += '</g>';
  });
  return s;
}
function miniPitch(lineup, gkId, inIds, key){
  var placed = blockPlacement(key, lineup, gkId);
  return '<svg class="minipitch" viewBox="0 0 300 350" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">'
    + pitchBody(placed, gkId, inIds, key, true) + '</svg>';
}
/* ---------- 1画面まとめ（スクショ用） ---------- */
function blockList(){
  var r = ui.rotResult, out = [], s0 = 0;
  if (!r) return out;
  for (var j = 1; j <= r.grid.length; j++){
    if (j === r.grid.length || r.sub[j]){ out.push({ from: s0, to: j - 1 }); s0 = j; }
  }
  return out;
}
function autoCols(n, cellW, cellH){
  /* スマホ画面(縦長)に収まりやすい縦横比 0.5 に最も近い列数を選ぶ */
  var best = 1, bestScore = 1e9;
  for (var c = 1; c <= Math.min(3, n); c++){
    var rws = Math.ceil(n / c);
    var w = c * cellW + (c - 1) * 12;
    var hh = rws * cellH + (rws - 1) * 12;
    var score = Math.abs(Math.log((w / hh) / 0.5));
    if (score < bestScore - 0.001){ bestScore = score; best = c; }
  }
  return best;
}
function summarySVG(){
  var r = ui.rotResult;
  var blocks = blockList();
  var n = blocks.length;
  var PW = 300, PH = 350, GAP = 12, PAD = 14;
  var HEAD = 22, FOOT = 30, cellH = HEAD + PH + FOOT;
  var top = 62;
  var cols = ui.shotCols ? Math.min(ui.shotCols, n) : autoCols(n, PW, cellH);
  var rows = Math.ceil(n / cols);
  var W = PAD * 2 + cols * PW + (cols - 1) * GAP;
  var H = top + rows * cellH + (rows - 1) * GAP + PAD;
  var ev = null;
  if (ui.eventId) S.events.forEach(function(x){ if (x.id === ui.eventId) ev = x; });
  var title = ev ? evLabel(ev) : "ローテーション表";
  var sub = ui.rot.total + "分 ／ " + ui.rot.attend.length + "名 ／ 1枠" + (Math.round(r.segMin * 10) / 10) + "分";

  var s = '<svg id="shotsvg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;border-radius:10px">';
  s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>';
  s += '<rect x="0" y="0" width="' + W + '" height="46" fill="#16211B"/>';
  s += '<text x="' + PAD + '" y="29" font-size="17" font-weight="700" fill="#ffffff">' + esc(title) + '</text>';
  s += '<text x="' + PAD + '" y="58" font-size="11" fill="#66736B">' + esc(sub) + '</text>';

  var lastRowCount = n - (rows - 1) * cols;
  var prev = null;
  blocks.forEach(function(bl, bi){
    var col = bi % cols, row = Math.floor(bi / cols);
    var offset = 0;
    if (row === rows - 1 && lastRowCount < cols){
      offset = (cols - lastRowCount) * (PW + GAP) / 2; /* 最終行を中央寄せ */
    }
    var ox = PAD + col * (PW + GAP) + offset;
    var oy = top + row * (cellH + GAP);
    var lineup = r.grid[bl.from];
    var t0 = Math.round(bl.from * r.segMin), t1 = Math.round((bl.to + 1) * r.segMin);
    var inIds = prev ? lineup.filter(function(id){ return prev.indexOf(id) < 0; }) : [];
    var outIds = prev ? prev.filter(function(id){ return lineup.indexOf(id) < 0; }) : [];
    s += '<text x="' + ox + '" y="' + (oy + 15) + '" font-size="13" font-weight="700" fill="#16211B">第' + (bi + 1) + 'ブロック ' + t0 + '〜' + t1 + '分</text>';
    s += '<g transform="translate(' + ox + ',' + (oy + HEAD) + ')">';
    var gkThis = curGk(lineup);
    s += pitchBody(blockPlacement(String(bl.from), lineup, gkThis), gkThis, inIds, String(bl.from), false);
    s += '</g>';
    function nms(ids){ return ids.map(function(id){ var m = memById(id); return m ? m.name : "?"; }).join("、"); }
    if (outIds.length || inIds.length){
      var y2 = oy + HEAD + PH + 14;
      s += '<text x="' + ox + '" y="' + y2 + '" font-size="10" font-weight="700" fill="#C63B3B">OUT ' + esc(nms(outIds)) + '</text>';
      s += '<text x="' + ox + '" y="' + (y2 + 13) + '" font-size="10" font-weight="700" fill="#2E7D4F">IN ' + esc(nms(inIds)) + '</text>';
    } else {
      s += '<text x="' + ox + '" y="' + (oy + HEAD + PH + 14) + '" font-size="10" fill="#66736B">スタート</text>';
    }
    prev = lineup;
  });
  s += '</svg>';
  return s;
}

  for (i = 0; i < b.bench.length; i++){ if (b.bench[i].id === id) return { t: b.bench[i], bench: true }; }
  return null;

        h += '<div class="mlist" style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px">';
        if (S.members.length === 0) h += '<div style="padding:12px;font-size:12px" class="mut">メンバー未登録です</div>';
        var b = board(), assigned = {}, benched = {};
        b.tokens.forEach(function(x){ if (x.memberId) assigned[x.memberId] = true; });
        b.bench.forEach(function(x){ if (x.memberId) benched[x.memberId] = true; });
        S.members.forEach(function(m){
          h += '<button onclick="act.assignMember(\'' + m.id + '\')">';
          h += '<span class="badge" style="background:' + pc(primaryPos(m)) + '">' + primaryPos(m) + '</span><span class="grow" style="font-weight:700;font-size:13px">' + esc(memLabel(m)) + '</span>';
          if (assigned[m.id]) h += '<span style="font-size:10px" class="mut">配置中→移動</span>';
          else if (benched[m.id]) h += '<span style="font-size:10px" class="mut">ベンチ→移動</span>';
          h += '</button>';
        });
        h += '</div><div class="lbl-s" style="margin-bottom:4px">または助っ人の名前を入力</div>';
        h += '<div class="row" style="margin-bottom:12px"><input class="in grow" id="guestname" placeholder="例: 田中（助っ人）"><button class="btn grn" onclick="act.setGuest()">設定</button></div>';
      }
      h += '<div class="row"><button class="btn gho grow" onclick="act.clearToken()">' + (hasPlayer ? "この枠を空にする" : "未定に戻す") + '</button>';
      if (t.guest || isBench) h += '<button class="btn dgr grow" onclick="act.deleteToken()">枠を削除</button>';
      h += '</div>';
    }
  }
  el.innerHTML = h;
  el.className = "show";
}

/* ================= rotation algorithm ================= */
function buildRotation(players, fieldCount, totalMin, segments, gkArr){
  var segMin = totalMin / segments;
  var time = {}, lastOn = {}, gkTime = {}, P = {};
  players.forEach(function(p){ time[p.id] = 0; lastOn[p.id] = -99; gkTime[p.id] = 0; P[p.id] = p; });
  var gks = (gkArr || []).filter(function(id){ return P[id]; });
  var grid = [];
  var gkRR = 0;
  for (var s = 0; s < segments; s++){
    var gkOnId = null;
    if (gks.length){
      /* GK枠: これまでのGK時間が最小の人を選ぶ(遅刻合流も考慮) */
      var avail = gks.filter(function(id){ return P[id].from - 1 <= s; });
      if (!avail.length) avail = gks.slice();
      avail.sort(function(a, b){ return gkTime[a] - gkTime[b] || (a > b ? 1 : -1); });
      gkOnId = avail[0];
      gkTime[gkOnId] += segMin;
    }
    var pool = players.filter(function(p){
      if (gks.indexOf(p.id) >= 0) return false;
      if (p.from - 1 > s) return false;
      if (p.max && time[p.id] + segMin > p.max + 0.01) return false;
      return true;
    });
    var need = Math.min(pool.length, fieldCount - (gkOnId ? 1 : 0));
    pool.sort(function(a, b){
      return (time[a.id] / a.w - time[b.id] / b.w) || (lastOn[a.id] - lastOn[b.id]) || (a._r - b._r);
    });
    var on = pool.slice(0, need).map(function(p){ return p.id; });
    if (gkOnId){ on.unshift(gkOnId); time[gkOnId] += segMin; lastOn[gkOnId] = s; }
    on.forEach(function(id){ if (id !== gkOnId){ time[id] += segMin; lastOn[id] = s; } });
    grid.push(on);
  }
  return { grid: grid, segMin: segMin, gks: gks };
}

function autoGk(){
  /* 現状のgks から離脱者を除去。空なら参加GKを自動採用 */
  ui.rot.gks = (ui.rot.gks || []).filter(function(id){ return ui.rot.attend.indexOf(id) >= 0; });
  if (ui.rot.gks.length === 0){
    ui.rot.gks = ui.rot.attend.filter(function(id){ var m = memById(id); return m && primaryPositions(m).indexOf("GK") >= 0; });
  }
}

    var tmp = { memberId: a.memberId, name: a.name, guest: a.guest };
    a.memberId = c.memberId; a.guest = c.guest;
    a.name = (c.memberId || c.guest) ? c.name : "控え";

    ui.eventId = ev.id;
    var attend = [], guests = [];
    var all = (ev.tokens || []).filter(function(t){ return t.side === "ally"; }).concat(ev.bench || []);
    if (all.length){
      all.forEach(function(t){
        if (t.memberId && memById(t.memberId)){ if (attend.indexOf(t.memberId) < 0) attend.push(t.memberId); }
        else if (t.guest && t.name){
          var gid = "g_" + ev.id + "_" + t.id;
          guests.push({ id: gid, name: t.name, guest: true, pos: t.pos || "CM", sub: [] });
          attend.push(gid);
        }
      });
    }
    if (ev.rot){
      ui.rot.field = ev.rot.field; ui.rot.total = ev.rot.total; ui.rot.seg = ev.rot.seg;
      ui.rot.gk = ev.rot.gk || ""; ui.rot.gks = (ev.rot.gks || (ev.rot.gk ? [ev.rot.gk] : [])).slice();
      ui.rot.opts = JSON.parse(JSON.stringify(ev.rot.opts || {}));
      ui.rot.guests = ev.rot.guests ? JSON.parse(JSON.stringify(ev.rot.guests)) : guests;
      ui.rot.attend = (ev.rot.attend && ev.rot.attend.length) ? ev.rot.attend.slice() : attend;
      ui.rotResult = ev.rot.result ? JSON.parse(JSON.stringify(ev.rot.result)) : null;
    } else {
      ui.rot.guests = guests; ui.rot.attend = attend;
      ui.rot.opts = {}; ui.rot.gk = ""; ui.rot.gks = []; ui.rotResult = null;
    }
    ui.evEditMode = false;
    autoGk();
  },
  _autoPlaceFromAttend: function(){
    var b = board();
    var slots = getSlots(ui.fname);
    var cand = ui.rot.attend.map(function(id){ return memById(id); }).filter(Boolean);
    var asg = assignByPriority(slots.map(function(sl){ return sl[0]; }), cand);
    var used = asg.used;
    var ally = slots.map(function(sl, i){
      var m = asg.res[i];
      var gg = m && String(m.id).indexOf("g_") === 0;
      var y = b.showEnemy ? compress(sl[2]) : sl[2];
      return { id: uid(), side: "ally", pos: sl[0], x: sl[1], y: y, memberId: (m && !gg) ? m.id : null, name: m ? m.name : "未定", guest: !!gg };
    });
    var enemies = b.tokens.filter(function(t){ return t.side === "enemy"; });
    var rest = cand.filter(function(m){ return !used[m.id]; }).map(function(m){
      var gg = String(m.id).indexOf("g_") === 0;
      return { id: uid(), memberId: gg ? null : m.id, name: m.name, guest: gg };
    });
    b.fname = ui.fname;
    b.tokens = ally.concat(enemies);
    b.bench = rest;
  },
  delEvent: function(id){
    var ev = null;
    S.events.forEach(function(x){ if (x.id === id) ev = x; });
    if (!ev) return;
    if (!confirm("「" + evLabel(ev) + "」を削除しますか？")) return;
    S.events = S.events.filter(function(x){ return x.id !== id; });
    if (ui.eventId === id){ ui.eventId = null; ui.rot.guests = []; }
    save(); render();
  },
  pickEvent: function(id){
    if (!id){
      ui.eventId = null; ui.rot.guests = []; ui.rot.attend = []; ui.rotResult = null;
      ui.rot.opts = {}; ui.rot.gks = []; ui.rot.gk = "";
      ui.showAttend = true;
      render(); return;
    }
    var ev = null;
    S.events.forEach(function(x){ if (x.id === id) ev = x; });
    if (!ev) return;
    act._applyEventToRot(ev);
    ui.showAttend = true;
    render();
  },
  newEventFromRot: function(){
    if (ui.rot.attend.length === 0) return;
    var today = new Date();
    var d = today.getFullYear() + "-" + ("0" + (today.getMonth() + 1)).slice(-2) + "-" + ("0" + today.getDate()).slice(-2);
    ui.evForm = { id: null, date: d, opponent: "", note: "", fromRot: true };
    ui.sheet = { type: "event" };
    renderSheet();
  },
  saveRotToEvent: function(){
    if (!ui.eventId) return;
    var b = board();
    S.events.forEach(function(ev){
      if (ev.id !== ui.eventId) return;
      ev.rot = {
        field: ui.rot.field, total: ui.rot.total, seg: ui.rot.seg, gk: ui.rot.gk, gks: (ui.rot.gks || []).slice(),
        attend: ui.rot.attend.slice(),
        opts: JSON.parse(JSON.stringify(ui.rot.opts)),
        guests: JSON.parse(JSON.stringify(ui.rot.guests || [])),
        result: ui.rotResult ? JSON.parse(JSON.stringify(ui.rotResult)) : null
      };
      /* ボードの編成も一緒に更新（ボードで作業した内容を保持） */
      if (b.tokens && b.tokens.some(function(t){ return t.side === "ally"; })){
        ev.fname = b.fname;
        ev.tokens = JSON.parse(JSON.stringify(b.tokens));
        ev.bench = JSON.parse(JSON.stringify(b.bench));
        ev.showEnemy = b.showEnemy; ev.showBench = b.showBench;
      }
    });
    save();
    alert("試合を更新しました");
  },

  /* rotation */
  rotToggle: function(id){
    var i = ui.rot.attend.indexOf(id);
    if (i >= 0){
      ui.rot.attend.splice(i, 1);
      if (ui.rot.gk === id) ui.rot.gk = "";
    } else ui.rot.attend.push(id);
    autoGk();
    render();
  },
  gkToggle: function(id){
    ui.rot.gks = ui.rot.gks || [];
    var i = ui.rot.gks.indexOf(id);
    if (i >= 0) ui.rot.gks.splice(i, 1); else ui.rot.gks.push(id);
    render();
  },
  optT: function(id, v){ var o = (ui.rot.opts[id] = ui.rot.opts[id] || {}); o.tmin = v === "" ? "" : +v; if (o.tmin) o.w = "norm"; render(); },
  optW: function(id, v){ (ui.rot.opts[id] = ui.rot.opts[id] || {}).w = v; render(); },
  optFrom: function(id, v){ (ui.rot.opts[id] = ui.rot.opts[id] || {}).from = +v; render(); },
  preset: function(v){
    if (v === "") return;
    var all = TIME_PRESETS.concat(S.timePresets);
    var p = all[+v];
    if (!p) return;
    ui.rot.presetIdx = String(v);
    ui.rot.total = p[1];
    ui.rot.seg = (p[1] % 15 === 0) ? p[1] / 15 : p[2];
    var ti = document.getElementById("rot-total"), si = document.getElementById("rot-seg");
    if (ti) ti.value = ui.rot.total;
    if (si) si.value = ui.rot.seg;
    setTimeout(render, 80);
  },
  seg15: function(){
    if (ui.rot.total % 15 !== 0) return;
    ui.rot.seg = ui.rot.total / 15;
    render();
  },
  addPreset: function(){
    var v = prompt("追加する試合時間を入力\n例: 35×2（35分を2本） / 35x2 / 70（合計分のみ）");
    if (!v) return;
    v = v.trim();
    var m = v.match(/^(\d+)\s*[×xX*]\s*(\d+)$/);
    if (m){
      var a = +m[1], bnum = +m[2];
      S.timePresets.push([a + "分×" + bnum + "本", a * bnum, bnum]);
    } else if (/^\d+$/.test(v)){
      S.timePresets.push([v + "分(合計)", +v, ui.rot.seg]);
    } else {
      alert("形式が読み取れませんでした。「35×2」または「70」のように入力してください。");
      return;
    }
    save(); render();
  },
  runRot: function(){
    autoGk();
    var players = roster().filter(function(m){ return ui.rot.attend.indexOf(m.id) >= 0; })
      .map(function(m){
        var o = ui.rot.opts[m.id] || {};
        var tm = o.tmin || 0;
        var w = tm ? Math.max(0.2, tm / (ui.rot.total || 1)) : (o.w === "hi" ? 1.4 : o.w === "lo" ? 0.6 : 1);
        return { id: m.id, _r: Math.random(), w: w, from: o.from || 1, max: tm };
      });
    if (!players.length) return;
    var r = buildRotation(players, ui.rot.field, ui.rot.total, ui.rot.seg, gkIds());
    r.ids = players.map(function(p){ return p.id; });
    r.gk = null;
    r.sub = [];
    for (var i = 0; i < r.grid.length; i++) r.sub.push(true);
    r.layout = {};
    ui.rotResult = r;
    ui.rotView = "table";
    render();
  },
  shotCols: function(c){ ui.shotCols = c || null; render(); },
  makeImage: function(){
    var el = document.getElementById("shotsvg");
    var box = document.getElementById("shotimg");
    if (!el || !box) return;
    try {
      var xml = new XMLSerializer().serializeToString(el);
      var vb = el.getAttribute("viewBox").split(" ");
      var w = +vb[2], hh = +vb[3];
      var sc = w < 500 ? 3 : (w < 800 ? 2.5 : 2); /* 小さい図ほど高解像度で書き出す */
      var url = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
      var img = new Image();
      img.onload = function(){
        var c = document.createElement("canvas");
        c.width = w * sc; c.height = hh * sc;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        try {
          box.innerHTML = '<div class="lbl-s" style="margin:10px 0 4px">↓ この画像を長押し →「写真に追加」で保存できます</div><img src="' + c.toDataURL("image/png") + '" style="width:100%;border-radius:10px;border:1px solid var(--line)">';
          document.getElementById("shotwrap").style.display = "none";
        } catch(e2){ box.innerHTML = '<div class="lbl-s" style="color:var(--fw);margin-top:8px">画像化できませんでした。画面のスクリーンショットをご利用ください。</div>'; }
      };
      img.onerror = function(){
        box.innerHTML = '<div class="lbl-s" style="color:var(--fw);margin-top:8px">画像化できませんでした。画面のスクリーンショットをご利用ください。</div>';
      };
      img.src = url;
    } catch(e){
      box.innerHTML = '<div class="lbl-s" style="color:var(--fw);margin-top:8px">画像化できませんでした。画面のスクリーンショットをご利用ください。</div>';
    }
  },
  slotTap: function(key, si){
    ui.sheet = { type: "slot", key: key, si: si };
    renderSheet();
  },
  swapSlots: function(key, si, sj){
    var r = ui.rotResult;
    if (!r) return;
    if (!r.layout) r.layout = {};
    var lineup = r.grid[+key] || [];
    var placed = blockPlacement(key, lineup, r.gk);
    var map = {};
    placed.forEach(function(p){ if (p.si >= 0) map[p.si] = p.id; });
    var a = null, b2 = null;
    placed.forEach(function(p){ if (p.si === si) a = p; if (p.si === sj) b2 = p; });
    if (!a || !b2){ ui.sheet = null; render(); return; }
    if (sj === -1){
      /* 控え表示枠との入替 = そのスロットに控えの選手を入れる */
      map[si] = b2.id;
    } else {
      map[si] = b2.id; map[sj] = a.id;
    }
    r.layout[key] = map;
    ui.sheet = null;
    render();
  },
  clearLayout: function(key){
    var r = ui.rotResult;
    if (r && r.layout) delete r.layout[key];
    ui.sheet = null;
    render();
  },
  cell: function(pid, col){
    var r = ui.rotResult;
    if (!r) return;
    /* 連結ブロックの範囲を求める */
    var s = col; while (s > 0 && !r.sub[s]) s--;
    var e = col; while (e + 1 < r.grid.length && !r.sub[e + 1]) e++;
    var newState = r.grid[col].indexOf(pid) < 0;
    for (var c = s; c <= e; c++){
      var idx = r.grid[c].indexOf(pid);
      if (newState && idx < 0) r.grid[c].push(pid);
      if (!newState && idx >= 0) r.grid[c].splice(idx, 1);
    }
    render();
  },
  subToggle: function(i){
    var r = ui.rotResult;
    if (!r) return;
    r.sub[i] = !r.sub[i];
    if (!r.sub[i]){
      /* まとめる: ブロック先頭の並びをコピー */
      var s = i; while (s > 0 && !r.sub[s]) s--;
      var e = i; while (e + 1 < r.grid.length && !r.sub[e + 1]) e++;
      for (var c = s; c <= e; c++) r.grid[c] = r.grid[s].slice();
    }
    render();
  }
};

function tok(id){
  var f = findToken(id);
  return f ? f.t : {};
}

/* ================= pitch drag & tap ================= */
function bindPitch(){
  var pitch = document.getElementById("pitch");
  if (!pitch) return;
  var drag = null, ghost = null, lastE = null;

  function pct(e){
    var r = pitch.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 100 };
  }
  function inBench(e){
    var bb = document.getElementById("benchbar");
    if (!bb) return false;
    var r = bb.getBoundingClientRect();
    return e.clientX >= r.left - 4 && e.clientX <= r.right + 4 && e.clientY >= r.top && e.clientY <= r.bottom;
  }
  function benchItemAt(e){
    var bb = document.getElementById("benchbar");
    if (!bb) return null;
    var found = null;
    Array.prototype.forEach.call(bb.querySelectorAll(".btok[data-id]"), function(el){
      var r = el.getBoundingClientRect();
      if (e.clientY >= r.top - 4 && e.clientY <= r.bottom + 4) found = el.getAttribute("data-id");
    });
    return found;
  }
  function nearestToken(p, excludeId){
    var b = board(), best = null, bd = 999;
    b.tokens.forEach(function(t){
      if (t.side !== "ally") return;
      if (excludeId && t.id === excludeId) return;
      var d = Math.sqrt(Math.pow(t.x - p.x, 2) + Math.pow((t.y - p.y) * 0.75, 2));
      if (d < bd){ bd = d; best = t; }
    });
    return bd < 7.5 ? best : null;
  }
  function makeGhost(label, color){
    ghost = document.createElement("div");
    ghost.className = "token";
    ghost.style.pointerEvents = "none";
    ghost.style.zIndex = 9;
    ghost.innerHTML = '<div class="disc" style="background:' + color + ';box-shadow:0 4px 12px rgba(0,0,0,.5)">↔</div><div class="nm">' + esc(label) + '</div>';
    pitch.appendChild(ghost);
  }
  function highlight(id){
    Array.prototype.forEach.call(pitch.querySelectorAll(".token"), function(el){
      if (id && el.getAttribute("data-id") === id) el.classList.add("target");
      else el.classList.remove("target");
    });
  }
  function cleanup(){
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    ghost = null;
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onCancel);
    window.removeEventListener("blur", onCancel);
  }

  function onMove(e){
    if (!drag) return;
    lastE = { clientX: e.clientX, clientY: e.clientY };
    if (!drag.moved && Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6){
      drag.moved = true;
      if (drag.kind === "bench"){
        var f = findToken(drag.id);
        var m = f && f.t.memberId ? memById(f.t.memberId) : null;
        makeGhost(f ? f.t.name : "", m ? pc(primaryPos(m)) : "var(--pitchA)");
        if (drag.el) drag.el.classList.add("lifted");
      }
    }
    if (!drag.moved) return;
    e.preventDefault();
    var p = pct(e);
    if (drag.kind === "bench"){
      if (ghost){ ghost.style.left = p.x + "%"; ghost.style.top = p.y + "%"; }
      var tgt = inBench(e) ? null : nearestToken(p);
      highlight(tgt ? tgt.id : null);
      return;
    }
    var t = tok(drag.id);
    var x = Math.max(2, Math.min(98, p.x));
    var y = clampTokenY(t, p.y);
    drag.el.style.left = x + "%";
    drag.el.style.top = y + "%";
    t.x = x; t.y = y;
    var swapTgt = (!inBench(e)) ? nearestToken(p, drag.id) : null;
    highlight(swapTgt ? swapTgt.id : null);
  }

  function finish(e){
    var d = drag;
    drag = null;
    cleanup();
    if (!d) return;
    if (d.el) d.el.classList.remove("lifted");
    highlight(null);
    if (!d.moved){
      ui.sheet = { type: "token", id: d.id };
      renderSheet(); rerenderSel();
      return;
    }
    if (d.kind === "bench"){
      if (e && inBench(e)){
        var bid0 = benchItemAt(e);
        if (bid0 && bid0 !== d.id){ act.swapAny(d.id, bid0); return; } /* ベンチ↔ベンチ */
        render(); return;
      }
      if (e){
        var tgt = nearestToken(pct(e));
        if (tgt){ act.swapBenchField(d.id, tgt.id); return; } /* ベンチ→フィールド */
      }
      render(); return;
    }
    /* フィールドの駒 */
    if (e && inBench(e)){
      var bid = benchItemAt(e);
      if (bid){ act.swapBenchField(bid, d.id); return; } /* フィールド→ベンチ枠 */
      act.fieldToBench(d.id); return;                    /* フィールド→ベンチ空き */
    }
    if (e){
      var tgt2 = nearestToken(pct(e), d.id);
      if (tgt2){
        var mv = tok(d.id);
        if (mv && d.ox != null){ mv.x = d.ox; mv.y = d.oy; } /* 掴んだ駒を元位置へ戻す */
        act.swapAny(d.id, tgt2.id);
        return;
      }
    }
    save(); render();
  }
  function onUp(e){ finish(e); }
  function onCancel(){ finish(lastE); }

  pitch.addEventListener("pointerdown", function(e){
    if (drag) return;
    var target = null, kind = null;
    var bt = e.target.closest ? e.target.closest(".btok") : null;
    if (bt && bt.getAttribute("data-id")){ target = bt; kind = "bench"; }
    else {
      var el = e.target.closest ? e.target.closest(".token") : null;
      if (el){ target = el; kind = "field"; }
    }
    if (!target) return;
    e.preventDefault();
    lastE = { clientX: e.clientX, clientY: e.clientY };
    var _t0 = tok(target.getAttribute("data-id"));
    drag = { kind: kind, id: target.getAttribute("data-id"), el: target, sx: e.clientX, sy: e.clientY, moved: false, ox: _t0 ? _t0.x : null, oy: _t0 ? _t0.y : null };
    document.addEventListener("pointermove", onMove, { passive: false });
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onCancel);
    window.addEventListener("blur", onCancel);
  });

  /* iOSがスクロールに横取りするのを防ぐ */
  pitch.addEventListener("touchmove", function(e){
    if (drag && drag.moved) e.preventDefault();
  }, { passive: false });
}
function rerenderSel(){
  document.querySelectorAll(".token").forEach(function(el){
    if (ui.sheet && el.getAttribute("data-id") === ui.sheet.id) el.classList.add("sel");
    else el.classList.remove("sel");
  });
}

/* ================= member list drag reorder ================= */
function bindMemberDrag(){
  var list = document.getElementById("memlist");
  if (!list) return;
  var drag = null;
  list.addEventListener("pointerdown", function(e){
    var handle = e.target.closest(".dragh");
    if (!handle) return;
    e.preventDefault();
    var row = handle.closest(".memrow");
    try { handle.setPointerCapture(e.pointerId); } catch(err){}
    drag = { row: row };
    row.classList.add("dragging");
  });
  list.addEventListener("pointermove", function(e){
    if (!drag) return;
    e.preventDefault();
    var rows = Array.prototype.slice.call(list.children);
    for (var i = 0; i < rows.length; i++){
      var sib = rows[i];
      if (sib === drag.row) continue;
      var r = sib.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2){
        if (sib.previousSibling !== drag.row) list.insertBefore(drag.row, sib);
        return;
      }
    }
    if (list.lastElementChild !== drag.row) list.appendChild(drag.row);
  });
  function up(){
    if (!drag) return;
    drag.row.classList.remove("dragging");
    var ids = Array.prototype.map.call(list.children, function(el){ return el.getAttribute("data-id"); });
    drag = null;
    act.reorderMembers(ids);
  }
  list.addEventListener("pointerup", up);
  list.addEventListener("pointercancel", up);
}

/* ================= boot ================= */
render();
if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
